<style>
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --surface2:#f0ede5;
  --surface3:#e8e3d4;
  --border:#d8d2c4;
  --border-strong:#b8b0a0;
  --text:#1f2b24;
  --text-dim:#475a4f;
  --muted:#6b7a72;
  --tertiary:#9aa49d;
  --gold:#a07a28;
  --gold-bg:#fdf6e8;
  --green:#3d6b3a;
  --green-bg:#ecfdf5;
  --green-bright:#5a9551;
  --warn:#a07a28;
  --warn-bg:#fef7e0;
  --red:#a04a3d;
  --red-bg:#fde8e7;
  --blue:#3d6b8c;
  --blue-bg:#e6f1fb;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  visibility:hidden;
}
body.leader-authenticated{visibility:visible;}

#leaderGateBlackout{
  position:fixed;inset:0;background:var(--bg);z-index:99999;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;
}

/* ── TOPBAR ── */
.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.topbar-title{font-size:17px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.topbar-meta{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
.back-btn{
  background:var(--surface2);color:var(--text);border:1px solid var(--border);
  padding:7px 13px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;
}
.back-btn:hover{background:var(--border);}

.container{max-width:1100px;margin:0 auto;padding:18px 20px 40px;}

/* ── FILTER BARS ── */
.filter-bar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  margin-bottom:12px;
}
.filter-bar select,.filter-bar input[type="date"]{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:8px 11px;
  font-family:inherit;
  font-size:13px;
  color:var(--text);
  cursor:pointer;
}
.filter-bar select:focus,.filter-bar input[type="date"]:focus{outline:none;border-color:var(--green-bright);}
.filter-bar input[type="date"]{color-scheme:light;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;
  transition:filter .12s,background .15s;
}
.btn:hover{background:var(--surface2);}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green);}
.btn-primary:hover{filter:brightness(1.08);background:var(--green);}

/* ── COLUMN-CHIP ROW ── */
.chip-row{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding:8px 12px;
  background:var(--surface2);
  border-radius:8px;
  margin-bottom:18px;
}
.chip-label{
  font-size:11px;color:var(--muted);
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-right:4px;
}
.chip{
  font-size:11px;font-weight:600;
  padding:5px 11px;border-radius:14px;
  border:1px solid var(--border-strong);background:transparent;color:var(--muted);
  font-family:inherit;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;
}
.chip.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
.chip:hover:not(.on){background:var(--surface);}
.chip-meta{margin-left:auto;font-size:11px;color:var(--muted);}

/* ── SUMMARY CARDS ── */
.summary-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;
  margin-bottom:20px;
}
.summary-card{
  background:var(--surface2);border-radius:10px;padding:14px 16px;
}
.summary-label{font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.summary-value{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.1;}
.summary-value .unit{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;}
.summary-sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* ── LCG CARDS ── */
.lcg-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
}
.lcg-head{
  padding:11px 16px;
  background:var(--surface2);
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  user-select:none;
}
.lcg-head:hover{background:var(--surface3);}
.lcg-head.collapsed{border-bottom:0;}
.lcg-chev{font-size:14px;color:var(--muted);transition:transform .15s;flex-shrink:0;}
.lcg-head.collapsed .lcg-chev{transform:rotate(-90deg);}
.lcg-title{font-size:14px;font-weight:700;}
.lcg-pill{
  background:var(--blue-bg);color:var(--blue);
  font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600;
}
.lcg-summary{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600;}

.lcg-body{padding:0;}
.lcg-card.collapsed .lcg-body{display:none;}

/* ── TABLE ── */
.table-scroll{overflow-x:auto;}
table.members-tbl{
  width:100%;border-collapse:collapse;font-size:12px;
  min-width:760px;
}
.members-tbl thead tr{background:var(--surface2);}
.members-tbl th{
  text-align:left;padding:9px 8px;
  font-weight:700;color:var(--muted);
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1px solid var(--border);
}
.members-tbl th.numcol{text-align:left;}
.members-tbl th.othercol{text-align:center;}
.members-tbl td{
  padding:10px 8px;border-bottom:1px solid var(--border);
  vertical-align:top;
}
.members-tbl tr:last-child td{border-bottom:0;}
.members-tbl tr:hover td{background:rgba(0,0,0,.015);}

.mem-cell{display:flex;align-items:center;gap:8px;min-width:140px;}
.mem-av{
  width:28px;height:28px;border-radius:50%;
  background:var(--surface2);color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.mem-av.lcl{background:var(--blue-bg);color:var(--blue);}
.mem-name{font-weight:600;font-size:13px;line-height:1.25;}
.mem-meta{font-size:10px;color:var(--muted);margin-top:1px;}

.ratio-main{font-weight:700;font-size:13px;line-height:1.25;}
.pct{font-size:10px;margin-left:3px;font-weight:600;}
.pct.green{color:var(--green-bright);}
.pct.amber{color:var(--warn);}
.pct.red{color:var(--red);}
.split{font-size:10px;color:var(--muted);margin-top:2px;}
.dash{color:var(--tertiary);}

.othersub{font-size:9.5px;color:var(--muted);margin-top:2px;font-style:italic;cursor:help;}

/* ── LOADING / EMPTY ── */
.state-card{
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:12px;
  padding:48px 20px;
  text-align:center;
  color:var(--muted);
}
.state-card .emoji{font-size:32px;margin-bottom:10px;}

.footnote{
  margin-top:20px;
  font-size:11px;color:var(--muted);
  font-style:italic;line-height:1.55;
}

/* Date inputs in date range row */
.daterange{display:none;gap:6px;align-items:center;}
.daterange.show{display:inline-flex;}
.daterange-label{font-size:11px;color:var(--muted);font-weight:600;}

/* ── Member drill-down ── */
.members-tbl tbody tr.mrow{cursor:pointer;transition:background .12s;}
.members-tbl tbody tr.mrow:hover{background:var(--gold-bg);}
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(20,25,22,.55);z-index:1000;
  align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;}
.detail-overlay.show{display:flex;}
.detail-modal{background:var(--surface);width:100%;max-width:680px;border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.3);border:1px solid var(--border);overflow:hidden;margin:auto;}
.dm-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);}
.dm-av{width:40px;height:40px;border-radius:50%;background:var(--surface3);color:var(--text);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto;}
.dm-av.lcl{background:var(--gold);color:#fff;}
.dm-title{flex:1;min-width:0;}
.dm-name{font-weight:700;font-size:16px;color:var(--text);}
.dm-meta{font-size:12px;color:var(--muted);}
.dm-x{background:none;border:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px;}
.dm-x:hover{background:var(--surface2);color:var(--text);}
.dm-body{padding:8px 20px 20px;}
.dm-sec{margin-top:16px;}
.dm-sec-h{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:13px;color:var(--text);
  text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.dm-sec-h .cnt{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;}
.dm-none{font-size:13px;color:var(--tertiary);font-style:italic;}
.dm-chips{display:flex;flex-wrap:wrap;gap:6px;}
.dm-chip{font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  padding:4px 8px;color:var(--text-dim);white-space:nowrap;}
.dm-chip .mode{color:var(--muted);}
.dm-chip .lname{color:var(--gold);font-weight:600;}
/* reflections */
.dm-refl{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface2);}
.dm-refl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.dm-refl-date{font-weight:700;font-size:12px;color:var(--text);}
.dm-refl-meta{font-size:11px;color:var(--muted);}
.dm-flag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;}
.dm-flag.short{background:var(--warn-bg);color:var(--warn);}
.dm-flag.blank{background:var(--red-bg);color:var(--red);}
.dm-flag.dup{background:var(--red-bg);color:var(--red);}
.dm-refl-text{font-size:13px;color:var(--text-dim);line-height:1.5;white-space:pre-wrap;word-break:break-word;
  max-height:160px;overflow-y:auto;}
.dm-loading{font-size:13px;color:var(--muted);font-style:italic;}
</style>

(function leaderGateBoot(){
  if (!window.MultiplyShared) {

<div class="topbar">
  <div>
    <div class="topbar-title">
      <span>📊</span>
      <span>Member Attendance Breakdown</span>
    </div>
    <div class="topbar-meta" id="topMeta">Loading…</div>
  </div>
  <a href="#" id="backLink" class="back-btn">← Back</a>

<div class="container">

  <!-- ── PRIMARY FILTERS ── -->
  <div class="filter-bar">
    <select id="rangeSel" onchange="onRangeChange()">

  <!-- ── COLUMN CHIPS ── -->
  <div class="chip-row" id="chipRow">
    <span class="chip-label">Columns</span>
    <button class="chip on" data-col="sunday" onclick="toggleCol(this)" title="Denominator = number of Sundays in the window">Sunday ✓</button>
    <button class="chip on" data-col="prayer" onclick="toggleCol(this)" title="Prayer Meeting (Wednesday) — denominator = number of Wednesdays in the window">Prayer ✓</button>
    <button class="chip on" data-col="devo"   onclick="toggleCol(this)" title="Daily devotional reflection — denominator is period days minus Sundays">Devotional ✓</button>
    <button class="chip on" data-col="lc"     onclick="toggleCol(this)" title="LC Meeting — denominator = number of weeks in the range (LC meets weekly)">LC ✓</button>
    <button class="chip on" data-col="btli"   onclick="toggleCol(this)" title="Denominator = number of lessons in the BTLI course">BTLI ✓</button>
    <button class="chip on" data-col="prepip" onclick="toggleCol(this)" title="Denominator = number of lessons in the Pre-Pipeline (Usbong) course">Pre-Pipeline ✓</button>
    <button class="chip on" data-col="minis"  onclick="toggleCol(this)" title="When off, Ministry rows roll into Other">Ministry ✓</button>
    <button class="chip on" data-col="other"  onclick="toggleCol(this)">Other ✓</button>
    <span class="chip-meta" id="chipMeta">All columns shown</span>
  </div>

  <!-- ── SUMMARY CARDS ── -->
  <div class="summary-grid" id="summaryGrid"></div>

  <!-- ── REPORT BODY ── -->

      <div class="emoji">⏳</div>
      <div>Loading attendance data…</div>
    </div>

</div>

<!-- Member drill-down modal -->
<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this)closeMemberDetail()">
  <div class="detail-modal" id="detailModal"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// MEMBER ATTENDANCE BREAKDOWN REPORT
// ─────────────────────────────────────────────────────────────
// Per-member attendance across all event types, scoped to a date
// window and LCG. Sunday + Prayer Meeting carry the in_person /
// online split (attendance_mode column, Session 8 morning ship).
// Each row shows attended/total with percentage for LC, BTLI,
// Pre-Pipeline, and Ministry. "Other" is a raw count + breakdown
// tooltip for heterogeneous low-frequency events.
//
// Standing rules baked in:
//   #16 (Session 8): Statistical reports EXCLUDE test members
//        AND guests (is_external_user=true) by default. MAR exception
//        (Session 10): if the VIEWER is themselves a test record,
//        test members ARE shown so they can smoke-test as an LCL.
//        Guests stay excluded in both cases. The "All (incl. inactive)"
//        toggle does not unlock test data — that's a separate axis.
//   Event-type to column mapping per pastoral conventions agreed
//        Session 8 PM (every member has an LCG; LC weekly; BTLI
//        twice/month per batch; Ministry presence-logged).
// ═══════════════════════════════════════════════════════════════

const db = MultiplyShared.getDB();

const STATE = {
  rows:          [],      // raw attendance rows for the window
  members:       [],      // members table (filtered for Test+Guest)
  leadersMap:    {},      // id → name (for LCG display name resolution)
  range:         { from: null, to: null, label: '' },
  cols:          { sunday:true, prayer:true, devo:true, lc:true, btli:true, prepip:true, minis:true, other:true },
  loading:       false,
};

// ─── Scope gating (Session 9, May 19 2026) ─────────────────────────
//
// MAR scope rules:
//   - Pipeline Level >= 3 (Coach+, Director, Executive Leader, Pastor):
//       can toggle between "All LCGs (Coach+ view)" and "My LCG only"
//   - Pipeline Level == 2 (Leader / LCL):
//       LOCKED to "My LCG only" — dropdown is hidden, scopeSel forced to
//       'mine'. An LCL should not be browsing other leaders' flocks.
//   - Anything else (shouldn't happen — gate is L2+ at quick-action level,
//       but defensive): treated like Level 2 (locked to 'mine').
//
// This is the canonical scope source for all consumers — summary cards,
// LCG render, and CSV export all read scope via _resolveScope() so the
// three surfaces stay in lockstep. Bypassing this helper to read the
// dropdown directly is a Session-8-shaped latent bug (CSV used to leak
// church-wide data when LCL was in "My LCG only" view — fixed here).

function _viewerCanSeeAllLCGs(){
  const lvl = (window.LEADER && window.LEADER.leaderLevel) || 0;
  return lvl >= 3;
}

// ─────────────────────────────────────────────────────────────
// Test-data containment (Session 10 — explicit pastoral review of
// Standing Rule #16 for MAR specifically).
//
// Rule: if the logged-in viewer is themselves a test record, MAR
// includes test members in the data. Otherwise (Pastor, real LCL,
// or anyone else) test+guest are hidden per Standing Rule #16.
//
// No inspection exception (unlike MD's modal containment). A report
// is a statistical aggregation, not an inspection surface — if Pastor
// needs to see a test LCL's MAR, the path is "log in as that test LCL",
// matching the smoke-test workflow.
//
// Other reports (LACR, LCG Pulse) keep Standing Rule #16 strictly for
// now — they were not part of this Session 10 review.
//
// Takes the freshly-fetched members array so we can resolve the viewer
// without a second Supabase round-trip.
// ─────────────────────────────────────────────────────────────
function _viewerIsTestMember(allMembersRaw){
  const myId = (window.LEADER && window.LEADER.leaderId) || null;
  if (!myId) return false;
  const me = (allMembersRaw || []).find(m => m.id === myId);
  return !!(me && me.is_test_member);
}

function _resolveScope(){
  if (!_viewerCanSeeAllLCGs()) return 'mine';
  const el = document.getElementById('scopeSel');
  return (el && el.value === 'mine') ? 'mine' : 'all';
}

// Return the leader-id whose LCG the current viewer "owns" — used as the
// roster key when scope is 'mine'. Returns null if the viewer isn't an
// LCL with a populated roster (newly-promoted L2 with zero disciples).
function _myLcgLeaderId(){
  const myId = (window.LEADER && window.LEADER.leaderId) || null;
  if (!myId) return null;
  return myId;
}

// Return the subset of STATE.members that fall within the resolved
// scope. In 'all' scope, returns everyone. In 'mine' scope, returns
// (a) the viewer themselves IF they're an LCL, AND (b) members whose
// discipler_id points to the viewer.
//
// Why this matters: summary cards + CSV export used to iterate over
// STATE.members unconditionally, leaking church-wide aggregates into
// what the user thought was a scoped view. With this helper, all three
// surfaces (summary, LCG list, CSV) honor the same scope.
function _scopedMembers(){
  if (_resolveScope() === 'all') return STATE.members;
  const myId = _myLcgLeaderId();
  if (!myId) return [];
  // Members in my LCG = those whose discipler_id == my id, PLUS me if
  // I'm an LCL (the LCG card shows the LCL's name as the header; flock
  // is the disciples). Per Memory #17 the leader is NOT shown in their
  // own LCG flock — but they ARE counted in summary totals because the
  // "Members tracked" summary is honest about who's in scope: my flock
  // and me. (If only flock were counted, a fresh L2 would see "0".)
  return STATE.members.filter(m => m.discipler_id === myId || m.id === myId);
}

// Event-type rollup classifier.
// IMPORTANT: 'Sunday School' is intentionally OTHER, not Sunday.
// Sunday column means "Sunday Service" only (the worship gathering).
const KNOWN_TYPES = new Set([
  'Sunday Service','Prayer Meeting','LC Meeting',
  'BTLI','Pre-Pipeline',
  'Sunday School','Youth Gathering','Team Building','Outing','Other'
]);

function classifyEvent(eventType){
  switch(eventType){
    case 'Sunday Service':   return 'sunday';
    case 'Prayer Meeting':   return 'prayer';
    case 'LC Meeting':       return 'lc';
    case 'BTLI':             return 'btli';
    case 'Pre-Pipeline':     return 'prepip';
    case 'devotional':       return 'devo';   // lowercase per MMT convention
    case 'Sunday School':
    case 'Youth Gathering':
    case 'Team Building':
    case 'Outing':
    case 'Other':            return 'other';
    default:
      // Anything unrecognized = ministry (per pastoral convention).
      // saveMinistryAttendance writes event_type = ministry name.
      return 'minis';
  }
}

// Count Sundays in a date range (inclusive). Used to derive the
// Devotional denominator: period_days - sundays_in_period.
// Pastoral convention (Session 8): devotionals are expected daily
// EXCEPT Sundays. A 90-day window with 13 Sundays → denominator 77.
// Count how many of a given weekday (0=Sun … 6=Sat) fall in [from,to] inclusive.
// Local-time dates (the YMD strings are Manila-local), so no UTC drift.
function countWeekdayInRange(fromYmd, toYmd, dow){
  const MS = window.MultiplyShared;
  if (MS && MS.dates) return MS.dates.countWeekday(fromYmd, toYmd, dow);   // shared single-source
  const from = new Date(fromYmd + 'T00:00:00'), to = new Date(toYmd + 'T00:00:00');
  let count = 0; const d = new Date(from);
  while (d <= to){ if (d.getDay() === dow) count++; d.setDate(d.getDate() + 1); }
  return count;
}
function countSundaysInRange(fromYmd, toYmd){
  return countWeekdayInRange(fromYmd, toYmd, 0);  // 0 = Sunday
}

function countDaysInRange(fromYmd, toYmd){
  const MS = window.MultiplyShared;
  if (MS && MS.dates) return MS.dates.countDays(fromYmd, toYmd);   // shared single-source
  const from = new Date(fromYmd + 'T00:00:00'), to = new Date(toYmd + 'T00:00:00');
  return Math.round((to - from) / 86400000) + 1;
}

// Number of weeks in the window (LC meetings are weekly). Rounded so a 90-day
// window → 13 weeks, a 30-day window → 4. Tiny ranges (<4 days) round to 0 → "—".
function countWeeksInRange(fromYmd, toYmd){
  const MS = window.MultiplyShared;
  if (MS && MS.dates) return MS.dates.weeksBetween(fromYmd, toYmd);   // shared single-source
  return Math.round(countDaysInRange(fromYmd, toYmd) / 7);
}

// ─── Date range helpers ────────────────────────────────────────
function ymd(d){
  const MS = window.MultiplyShared;
  if (MS && MS.dates) return MS.dates.toYMD(d);   // shared single-source
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function computeRange(sel){
  const today = new Date();
  if (sel === '30'){
    const from = new Date(today); from.setDate(from.getDate()-30);
    return { from: ymd(from), to: ymd(today), label: 'Last 30 days' };
  }
  if (sel === '90'){
    const from = new Date(today); from.setDate(from.getDate()-90);
    return { from: ymd(from), to: ymd(today), label: 'Last 90 days' };
  }
  if (sel === 'quarter'){
    const q = Math.floor(today.getMonth()/3);
    const from = new Date(today.getFullYear(), q*3, 1);
    return { from: ymd(from), to: ymd(today), label: 'This quarter' };
  }
  // custom
  const f = document.getElementById('dateFrom').value;
  const t = document.getElementById('dateTo').value;
  return { from: f || ymd(today), to: t || ymd(today), label: 'Custom range' };
}

function onRangeChange(){
  const sel = document.getElementById('rangeSel').value;
  const cust = document.getElementById('customDates');
  if (sel === 'custom'){
    cust.classList.add('show');
    if (!document.getElementById('dateFrom').value){
      const today = new Date();
      const ago = new Date(today); ago.setDate(ago.getDate()-90);
      document.getElementById('dateFrom').value = ymd(ago);
      document.getElementById('dateTo').value = ymd(today);
    }
  } else {
    cust.classList.remove('show');
  }
  loadReport();
}

// ─── Column chips ──────────────────────────────────────────────
function toggleCol(btn){
  const key = btn.dataset.col;
  STATE.cols[key] = !STATE.cols[key];
  btn.classList.toggle('on', STATE.cols[key]);
  btn.textContent = (key === 'prepip' ? 'Pre-Pipeline' :
                     key === 'minis'  ? 'Ministry' :
                     key === 'devo'   ? 'Devotional' :
                     key.charAt(0).toUpperCase()+key.slice(1))
                   + (STATE.cols[key] ? ' ✓' : '');
  updateChipMeta();
  renderReport();
}

function updateChipMeta(){
  const shown = Object.values(STATE.cols).filter(Boolean).length;
  const total = Object.keys(STATE.cols).length;
  let msg = `${shown} of ${total} shown`;
  if (!STATE.cols.minis && STATE.cols.other) msg = 'Ministry rolled into Other';
  document.getElementById('chipMeta').textContent = msg;
}

// ─── Load ──────────────────────────────────────────────────────
async function loadReport(){
  if (STATE.loading) return;
  STATE.loading = true;
  document.getElementById('reportBody').innerHTML =
    '<div class="state-card"><div class="emoji">⏳</div><div>Loading attendance data…</div></div>';

  const sel = document.getElementById('rangeSel').value;
  STATE.range = computeRange(sel);
  // topMeta = date-range info + (when scope is locked) a scope note.
  // Coach+ viewers can see scope from the dropdown itself; we don't
  // duplicate the note for them. L2 viewers get an explicit note so
  // they know the report is intentionally scoped to their own LCG.
  let metaText = `${STATE.range.label} · ${STATE.range.from} → ${STATE.range.to}`;
  if (!_viewerCanSeeAllLCGs()) {
    metaText += ` · Showing: My LCG only`;
  }
  document.getElementById('topMeta').textContent = metaText;

  try {
    // 1) Members — Standing Rule #16 + Session 10 test-data containment.
    //    Default: filter out test members AND guests.
    //    Exception: if the viewer is a test record themselves (smoke-test
    //    workflow), include test members so they can see their fixture flock.
    //    Guests stay excluded in both cases (separate category, not part of
    //    the smoke-test universe).
    const { data: mems, error: mErr } = await db.from('members')
      .select('id,name,lc_group,pipeline_level,is_facilitator,facilitator_role,is_test_member,is_external_user,discipler_id');
    if (mErr) throw mErr;
    const includeTest = _viewerIsTestMember(mems);
    STATE.members = (mems || []).filter(m => {
      if (m.is_external_user) return false;
      if (m.is_test_member && !includeTest) return false;
      return true;
    });

    // 2) Build LCG groupings — per Memory #17 (LCG grouping rule, Session 8).
    // Group BY LCL ID, not lc_group text. An LCL = is_facilitator=true OR
    // facilitator_role non-null. Disciples are assigned via discipler_id.
    // Leaders are NOT counted in their own LCG (they're facilitators, not
    // flock); they ARE counted in their upline's LCG (where their own
    // discipler_id points). lc_group text is just a display label.
    STATE.leadersMap = {};   // id → leader member object
    STATE.lcgRoster  = {};   // leader_id → array of member objects (their flock)
    STATE.unassigned = [];   // members whose discipler_id doesn't match any LCL

    STATE.members.forEach(m => {
      if (m.is_facilitator || m.facilitator_role){
        STATE.leadersMap[m.id] = m;
        if (!STATE.lcgRoster[m.id]) STATE.lcgRoster[m.id] = [];
      }
    });

    STATE.members.forEach(m => {
      const did = m.discipler_id;
      if (did && STATE.leadersMap[did]){
        // Edge: leader self-disciples → treat as orphan (would double-count)
        if (did === m.id){
          STATE.unassigned.push(m);
          return;
        }
        STATE.lcgRoster[did].push(m);
      } else if (!(m.is_facilitator || m.facilitator_role)){
        // Only disciples land in 'unassigned'. A leader without a discipler
        // is just an upline leader (Pastoral Staff etc.) — their own LCG
        // is already created above.
        STATE.unassigned.push(m);
      }
    });

    // 3) Attendance rows for the window — PAGINATED. PostgREST caps a single
    // request at 1000 rows; a 90-day window for ~200 members (with daily
    // devotional rows) runs to several thousand, so a single query silently
    // truncated to the first 1000 and dropped real attendance (the "doesn't
    // tally" bug). We page by id (stable, unique) until a short page returns.
    const PAGE = 1000;
    let allRows = [];
    for (let offset = 0; ; offset += PAGE){
      const { data: page, error: aErr } = await db.from('attendance')
        .select('member_id,event_type,event_date,event_name,present,attendance_mode')
        .gte('event_date', STATE.range.from)
        .lte('event_date', STATE.range.to)
        .order('id', { ascending: true })
        .range(offset, offset + PAGE - 1);
      if (aErr) throw aErr;
      if (!page || !page.length) break;
      allRows = allRows.concat(page);
      if (page.length < PAGE) break;       // last page
      if (offset > 500000) break;          // safety valve (~500k rows)
    }
    STATE.rows = allRows;

    // 4) Course sizes = # of lessons in each curriculum (one quiz row per
    // lesson). This is the BTLI / Pre-Pipeline denominator — the full course
    // size (auto-grows when a new lesson ships), NOT lessons held in the window.
    // Fail-soft: on error leave 0 → those cells render "—" rather than wrong.
    STATE.lessonCounts = { btli: 0, usbong: 0 };
    try {
      const [{ count: btliN }, { count: usbN }] = await Promise.all([
        db.from('btli_quizzes').select('*', { count: 'exact', head: true }),
        db.from('usbong_quizzes').select('*', { count: 'exact', head: true }),
      ]);
      STATE.lessonCounts.btli   = btliN || 0;
      STATE.lessonCounts.usbong = usbN  || 0;
    } catch(le){
      console.warn('[member_attendance_report] lesson-count load failed (non-fatal):', le);
    }

    renderReport();
  } catch(e){
    console.error('[member_attendance_report] load failed', e);
    document.getElementById('reportBody').innerHTML =
      `<div class="state-card"><div class="emoji">⚠️</div><div>Could not load: ${escHTML(e.message||String(e))}</div></div>`;
  } finally {
    STATE.loading = false;
  }
}

// ─── Aggregation ───────────────────────────────────────────────
// For each member, build:
//   buckets: { sunday: {present, total, online_p, online_a}, ...,
//              other: {present, total, breakdown: {event_type: present_count}} }
// 'total' = COUNT(DISTINCT event_date+event_type+event_name) where the
// member appears in attendance rows. 'present' = same with present=true.
// We dedupe on the natural attendance composite key.
function buildBuckets(){
  // ── Fixed denominators (present counts up against these; absent rows ignored)
  // Sunday  = # of Sundays in the window     Prayer = # of Wednesdays in the window
  // BTLI / Pre-Pipeline = # of lessons HELD in the window (distinct sessions)
  // Devotional = period days − Sundays (daily-except-Sunday convention)
  // LC + Ministry keep the rostered-session model (present OR absent rows).
  const sundayDenom = countWeekdayInRange(STATE.range.from, STATE.range.to, 0); // Sun
  const prayerDenom = countWeekdayInRange(STATE.range.from, STATE.range.to, 3); // Wed
  const lcDenom     = countWeeksInRange(STATE.range.from, STATE.range.to);      // weekly LC
  const btliDenom   = (STATE.lessonCounts && STATE.lessonCounts.btli)   || 0;  // # BTLI lessons in course
  const prepipDenom = (STATE.lessonCounts && STATE.lessonCounts.usbong) || 0;  // # Usbong lessons in course
  const devoDenominator = Math.max(0,
    countDaysInRange(STATE.range.from, STATE.range.to) -
    countSundaysInRange(STATE.range.from, STATE.range.to)
  );
  // Single source of truth for labels/footnote/CSV.
  STATE.denoms = { sunday: sundayDenom, prayer: prayerDenom, lc: lcDenom,
                   btli: btliDenom, prepip: prepipDenom, devo: devoDenominator };

  const byMember = {};
  // Seed every member so they appear even with zero attendance rows
  STATE.members.forEach(m => {
    byMember[m.id] = {
      member: m,
      sunday: fixedBucket(sundayDenom), prayer: fixedBucket(prayerDenom),
      devo:   { present: 0, total: devoDenominator },  // total is fixed; present counts up
      lc:     fixedBucket(lcDenom),
      btli:   fixedBucket(btliDenom), prepip: fixedBucket(prepipDenom),
      minis:  emptyBucket(),
      other:  emptyOther(),
    };
  });
  STATE.rows.forEach(r => {
    const m = byMember[r.member_id];
    if (!m) return; // member excluded (Test/Guest) or removed since
    let col = classifyEvent(r.event_type);
    // Column-merge: Ministry rolls into Other when minis chip is off
    if (col === 'minis' && !STATE.cols.minis) col = 'other';
    if (col === 'devo'){
      // Devotional: only count present (no absent rows are ever written).
      // total is the fixed period_days − Sundays denominator set at seed.
      if (r.present) m.devo.present++;
      return;
    }
    if (col === 'other'){
      m.other.total++;
      if (r.present) m.other.present++;
      const k = r.event_type || 'Unknown';
      m.other.breakdown[k] = (m.other.breakdown[k] || 0);
      if (r.present) m.other.breakdown[k]++;
      m.other.breakdownTotals[k] = (m.other.breakdownTotals[k] || 0) + 1;
    } else {
      const b = m[col];
      // Fixed-denominator columns (Sunday/Prayer/BTLI/Pre-Pipeline): total was set
      // at seed from the calendar / lesson-session count, so only count PRESENT
      // here. LC + Ministry keep the rostered model (total grows per row).
      const fixedDenomCol = (col === 'sunday' || col === 'prayer' || col === 'lc' || col === 'btli' || col === 'prepip');
      if (!fixedDenomCol) b.total++;
      if (r.present) b.present++;
      if ((col === 'sunday' || col === 'prayer')){
        const mode = r.attendance_mode || 'in_person';
        if (r.present){
          if (mode === 'online') b.onlinePresent++;
          else b.inPersonPresent++;
        }
      }
      // Capture event_name detail for ministry rows so the tooltip can
      // show "Worship Team 5/6" instead of just "5/6 in Ministry"
      if (col === 'minis'){
        const k = r.event_type;
        b.breakdown[k] = b.breakdown[k] || { present:0, total:0 };
        b.breakdown[k].total++;
        if (r.present) b.breakdown[k].present++;
      }
    }
  });
  return byMember;
}

function emptyBucket(){
  return { present:0, total:0, onlinePresent:0, inPersonPresent:0, breakdown:{} };
}
// Bucket with a pre-set fixed denominator (calendar Sundays/Wednesdays or
// lesson-session count). present + online/in-person split count up against it.
function fixedBucket(total){
  return { present:0, total: total||0, onlinePresent:0, inPersonPresent:0, breakdown:{} };
}
function emptyOther(){
  return { present:0, total:0, breakdown:{}, breakdownTotals:{} };
}

// ─── Render ────────────────────────────────────────────────────
function renderReport(){
  if (!STATE.members.length){
    document.getElementById('reportBody').innerHTML =
      '<div class="state-card"><div class="emoji">📋</div><div>No active members to report on.</div></div>';
    document.getElementById('summaryGrid').innerHTML = '';
    return;
  }
  updateChipMeta();
  const buckets = buildBuckets();
  renderSummary(buckets);
  renderLCGs(buckets);
  renderFootnote();
}

function renderSummary(buckets){
  // Member count + church-wide Sunday/Prayer/Devo denominators + Other total
  const activeOnly = document.getElementById('activeSel').value === 'active';
  // Session 9: summary aggregates honor scope. Previously this used the
  // unfiltered STATE.members, so "Members tracked: 170" stayed church-wide
  // even when the LCG-list below was scoped to one LCG — a confusing UX
  // and an accidental disclosure of church-wide aggregates to LCLs.
  const members = _scopedMembers();
  // "Other events logged" = every row that isn't Sunday/Prayer/devotional
  // (LC, BTLI, Pre-Pipeline, Ministry, Other, etc.) — raw row count.
  let otherTotal = 0;
  STATE.rows.forEach(r => {
    const et = r.event_type;
    if (et !== 'Sunday Service' && et !== 'Prayer Meeting' && et !== 'devotional') otherTotal++;
  });
  // Devotional denominator (period days minus Sundays) — same for all members
  const devoDenom = Math.max(0,
    countDaysInRange(STATE.range.from, STATE.range.to) -
    countSundaysInRange(STATE.range.from, STATE.range.to)
  );
  // Aggregate Sunday/Prayer/Devo averages across all members
  let sumSundayPct = 0, cntSundayPct = 0, sumOnlineSun = 0, sumInPersonSun = 0;
  let sumPrayerPct = 0, cntPrayerPct = 0, sumOnlinePr = 0, sumInPersonPr = 0;
  let sumDevoPct = 0, cntDevoPct = 0;
  members.forEach(m => {
    const b = buckets[m.id];
    if (b.sunday.total > 0){
      sumSundayPct += Math.min(100, (b.sunday.present / b.sunday.total) * 100);
      cntSundayPct++;
      sumOnlineSun += b.sunday.onlinePresent;
      sumInPersonSun += b.sunday.inPersonPresent;
    }
    if (b.prayer.total > 0){
      sumPrayerPct += Math.min(100, (b.prayer.present / b.prayer.total) * 100);
      cntPrayerPct++;
      sumOnlinePr += b.prayer.onlinePresent;
      sumInPersonPr += b.prayer.inPersonPresent;
    }
    if (b.devo.total > 0){
      sumDevoPct += Math.min(100, (b.devo.present / b.devo.total) * 100);
      cntDevoPct++;
    }
  });
  const sunAvg  = cntSundayPct ? Math.round(sumSundayPct / cntSundayPct) : 0;
  const prAvg   = cntPrayerPct ? Math.round(sumPrayerPct / cntPrayerPct) : 0;
  const devoAvg = cntDevoPct   ? Math.round(sumDevoPct   / cntDevoPct)   : 0;
  const sunTotalPresent = sumOnlineSun + sumInPersonSun;
  const prTotalPresent  = sumOnlinePr + sumInPersonPr;
  const sunOnlinePct = sunTotalPresent ? Math.round((sumOnlineSun/sunTotalPresent)*sunAvg) : 0;
  const sunF2fPct    = Math.max(0, sunAvg - sunOnlinePct);
  const prOnlinePct  = prTotalPresent  ? Math.round((sumOnlinePr/prTotalPresent)*prAvg) : 0;
  const prF2fPct     = Math.max(0, prAvg - prOnlinePct);

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card">
      <div class="summary-label">Members tracked</div>
      <div class="summary-value">${members.length}</div>
      <div class="summary-sub">${activeOnly ? 'active only' : 'all members'} · Test &amp; Guest excluded</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Sundays (${STATE.denoms.sunday})</div>
      <div class="summary-value">${sunAvg}<span class="unit">% avg</span></div>
      <div class="summary-sub">${sunF2fPct}% f2f · ${sunOnlinePct}% online</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Wednesdays (${STATE.denoms.prayer})</div>
      <div class="summary-value">${prAvg}<span class="unit">% avg</span></div>
      <div class="summary-sub">${prF2fPct}% f2f · ${prOnlinePct}% online</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Devotional (${devoDenom} days)</div>
      <div class="summary-value">${devoAvg}<span class="unit">% avg</span></div>
      <div class="summary-sub">daily reflection · Sundays excluded</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Other events logged</div>
      <div class="summary-value">${otherTotal.toLocaleString()}</div>
      <div class="summary-sub">LC · BTLI · Pre-Pipeline · Ministry · etc.</div>
    </div>
  `;
}

function renderLCGs(buckets){
  // Per Memory #17 (LCG grouping rule, Session 8): use STATE.lcgRoster
  // (keyed by leader.id), NOT lc_group text. Display name uses lc_group
  // text if set, else `${leader.firstName}'s LCG`. Leaders themselves are
  // NOT shown in their own LCG roster — they ARE shown in their upline's
  // LCG where applicable (e.g. Jane appears as flock in Pastor's LCG,
  // but her own LCG card has only her L3 disciples).
  const scope = _resolveScope();

  // Scope: which LCGs to render
  let leaderIds = Object.keys(STATE.lcgRoster);
  if (scope === 'mine'){
    const myId = (window.LEADER && window.LEADER.leaderId) || null;
    if (myId && STATE.lcgRoster[myId]) leaderIds = [myId];
    else leaderIds = [];
  }

  // Sort LCGs: by display name (alphabetical)
  leaderIds.sort((a, b) => {
    const nameA = lcgDisplayName(STATE.leadersMap[a]);
    const nameB = lcgDisplayName(STATE.leadersMap[b]);
    return nameA.localeCompare(nameB);
  });

  // Hide empty LCGs from the rendered list (an LCL with zero disciples in
  // window is uninformative); they still exist in data but don't clutter.
  // EXCEPTION: in "My LCG only" scope, always show even if empty.
  const cardLeaderIds = (scope === 'mine')
    ? leaderIds
    : leaderIds.filter(id => (STATE.lcgRoster[id] || []).length > 0);

  // Empty-state message — pastoral wording when the viewer is a newly-
  // commissioned L2 leader with zero disciples (Invariant #44 transient
  // state). Coach+ with no matching LCGs gets the generic message.
  if (!cardLeaderIds.length){
    const isLockedToMine = !_viewerCanSeeAllLCGs();
    const msg = isLockedToMine
      ? `<div class="state-card"><div class="emoji">🌱</div>
           <div style="font-weight:600;margin-bottom:.35rem">Walang disciples pa sa iyong LCG.</div>
           <div style="font-size:13px;color:var(--muted);line-height:1.55">Habang nagtatalaga si Pastor ng mga miyembro sa iyong pag-aalaga, lalabas sila dito.</div>
         </div>`
      : '<div class="state-card"><div class="emoji">📋</div><div>No LCGs match the current scope.</div></div>';
    document.getElementById('reportBody').innerHTML = msg;
    return;
  }

  const html = cardLeaderIds.map((leaderId, idx) =>
    renderLCGCard(leaderId, STATE.lcgRoster[leaderId] || [], buckets, idx === 0)
  ).join('');
  document.getElementById('reportBody').innerHTML = html;

  // Wire up collapse toggles
  document.querySelectorAll('.lcg-head').forEach(h => {
    h.addEventListener('click', () => {
      h.closest('.lcg-card').classList.toggle('collapsed');
      h.classList.toggle('collapsed');
    });
  });
}

function lcgDisplayName(leader){
  if (!leader) return '(unassigned)';
  const lcg = (leader.lc_group || '').trim();
  if (lcg) return lcg;
  const first = (leader.name || '').split(/\s+/)[0] || leader.name || '(LCL)';
  return `${first}'s LCG`;
}

function renderLCGCard(leaderId, members, buckets, firstOpen){
  const leader = STATE.leadersMap[leaderId];
  const displayName = lcgDisplayName(leader);
  // LCG-level Sunday + Prayer aggregates
  let sumSPct=0, cntS=0, sumPPct=0, cntP=0;
  members.forEach(m => {
    const b = buckets[m.id];
    if (!b) return;
    if (b.sunday.total){ sumSPct += b.sunday.present/b.sunday.total*100; cntS++; }
    if (b.prayer.total){ sumPPct += b.prayer.present/b.prayer.total*100; cntP++; }
  });
  const sAvg = cntS ? Math.round(sumSPct/cntS) : 0;
  const pAvg = cntP ? Math.round(sumPPct/cntP) : 0;

  // Sort members: LCL first, then alphabetical
  const sorted = [...members].sort((a,b) => {
    if (a.is_facilitator && !b.is_facilitator) return -1;
    if (!a.is_facilitator && b.is_facilitator) return 1;
    return (a.name||'').localeCompare(b.name||'');
  });

  return `
    <div class="lcg-card${firstOpen ? '' : ' collapsed'}">
      <div class="lcg-head${firstOpen ? '' : ' collapsed'}">
        <span class="lcg-chev">▼</span>
        <span class="lcg-title">${escHTML(displayName)}</span>
        <span class="lcg-pill">${members.length} active</span>
        <span class="lcg-summary">Sun ${sAvg}% · Prayer ${pAvg}%</span>
      </div>
      <div class="lcg-body">
        <div class="table-scroll">
          ${renderMembersTable(sorted, buckets)}
        </div>
      </div>
    </div>
  `;
}

function renderMembersTable(members, buckets){
  const cols = STATE.cols;
  // Build header
  const headParts = ['<th>Member</th>'];
  if (cols.sunday) headParts.push('<th>Sunday</th>');
  if (cols.prayer) headParts.push('<th>Prayer&nbsp;Mtg</th>');
  if (cols.devo)   headParts.push('<th>Devotional</th>');
  if (cols.lc)     headParts.push('<th>LC</th>');
  if (cols.btli)   headParts.push('<th>BTLI</th>');
  if (cols.prepip) headParts.push('<th>Pre-Pip</th>');
  if (cols.minis)  headParts.push('<th>Ministry</th>');
  if (cols.other)  headParts.push('<th class="othercol">Other</th>');

  const rows = members.map(m => {
    const b = buckets[m.id];
    const cells = [`<td>${memberCell(m)}</td>`];
    if (cols.sunday) cells.push(`<td>${ratioCell(b.sunday, true)}</td>`);
    if (cols.prayer) cells.push(`<td>${ratioCell(b.prayer, true)}</td>`);
    if (cols.devo)   cells.push(`<td>${ratioCell(b.devo, false)}</td>`);
    if (cols.lc)     cells.push(`<td>${ratioCell(b.lc, false)}</td>`);
    if (cols.btli)   cells.push(`<td>${ratioCell(b.btli, false)}</td>`);
    if (cols.prepip) cells.push(`<td>${ratioCell(b.prepip, false)}</td>`);
    if (cols.minis)  cells.push(`<td>${ministryCell(b.minis)}</td>`);
    if (cols.other)  cells.push(`<td style="text-align:center">${otherCell(b.other)}</td>`);
    return `<tr class="mrow" onclick="openMemberDetail('${m.id}')">${cells.join('')}</tr>`;
  }).join('');

  return `
    <table class="members-tbl">
      <thead><tr>${headParts.join('')}</tr></thead>
      <tbody>${rows || '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:24px">No members</td></tr>'}</tbody>
    </table>
  `;
}

function memberCell(m){
  const initials = (m.name||'').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
  const isLCL = m.is_facilitator;
  const role = isLCL ? (m.facilitator_role || 'LCL') : '';
  const level = (m.pipeline_level != null) ? `L${m.pipeline_level}` : '';
  const meta = [role, level].filter(Boolean).join(' · ');
  return `
    <div class="mem-cell">
      <div class="mem-av ${isLCL?'lcl':''}">${escHTML(initials||'?')}</div>
      <div>
        <div class="mem-name">${escHTML(m.name||'(no name)')}</div>
        ${meta?`<div class="mem-meta">${escHTML(meta)}</div>`:''}
      </div>
    </div>
  `;
}

function ratioCell(b, showMode){
  if (!b || b.total === 0) return '<span class="dash">—</span>';
  const pct = Math.min(100, Math.round((b.present / b.total) * 100));
  const cls = pct >= 80 ? 'green' : pct >= 50 ? 'amber' : 'red';
  const split = (showMode && (b.onlinePresent || b.inPersonPresent))
    ? `<div class="split">🏛️${b.inPersonPresent} · 🌐${b.onlinePresent}</div>`
    : '';
  return `<div class="ratio-main">${b.present}/${b.total} <span class="pct ${cls}">${pct}%</span></div>${split}`;
}

function ministryCell(b){
  if (!b || b.total === 0) return '<span class="dash">—</span>';
  const pct = Math.round((b.present / b.total) * 100);
  const cls = pct >= 80 ? 'green' : pct >= 50 ? 'amber' : 'red';
  // Build breakdown tooltip
  const items = Object.keys(b.breakdown || {}).sort();
  const tooltipParts = items.map(k => `${k} ${b.breakdown[k].present}/${b.breakdown[k].total}`);
  // Subtitle: show single ministry name if just one, else "N ministries"
  let sub = '';
  if (items.length === 1){
    sub = items[0];
  } else if (items.length > 1){
    sub = `${items.length} ministries`;
  }
  return `<div class="ratio-main">${b.present}/${b.total} <span class="pct ${cls}">${pct}%</span></div>${sub?`<div class="othersub" title="${escAttr(tooltipParts.join(' · '))}">${escHTML(sub)}</div>`:''}`;
}

function otherCell(b){
  if (!b || b.total === 0) return '<span class="dash">—</span>';
  const kinds = Object.keys(b.breakdownTotals || {}).filter(k => b.breakdownTotals[k] > 0);
  const tooltipParts = kinds.map(k => {
    const totalKnown = b.breakdownTotals[k];
    const presentKnown = b.breakdown[k] || 0;
    return `${k} ${presentKnown}/${totalKnown}`;
  });
  const kindLabel = kinds.length === 1 ? '1 kind' : `${kinds.length} kinds`;
  return `<div class="ratio-main">${b.present}/${b.total}</div><div class="othersub" title="${escAttr(tooltipParts.join(' · '))}">${escHTML(kindLabel)}</div>`;
}

function renderFootnote(){
  const off = Object.entries(STATE.cols).filter(([k,v]) => !v).map(([k]) => k);
  const d = STATE.denoms || {};
  const parts = [];
  parts.push(`Denominators for this window — Sunday: ${d.sunday??0} Sundays · Wednesday: ${d.prayer??0} Wednesdays · LC: ${d.lc??0} weeks · Devotional: ${d.devo??0} days (Sundays excluded). BTLI: ${d.btli??0} lessons · Pre-Pipeline: ${d.prepip??0} lessons (full course size, not window).`);
  parts.push('Sunday/Wednesday count days that PASSED in the window, LC counts weeks (LC meets weekly), Devotional counts days; BTLI/Pre-Pipeline divide by the whole course; Ministry reflects sessions the member was rostered for (present OR absent).');
  parts.push('"—" = nothing scheduled in window.');
  parts.push('Test members and Guests are always excluded.');
  if (!STATE.cols.minis && STATE.cols.other) parts.push('Ministry rows are rolled into Other.');
  parts.push('Hover Ministry / Other cells for the breakdown.');
  document.getElementById('footnote').textContent = parts.join(' · ');
}

// ─── CSV export ────────────────────────────────────────────────
function exportCSV(){
  const buckets = buildBuckets();
  const lines = [];
  const head = ['LCG','Member','Pipeline Level','Role',
    'Sunday Present','Sunday Total','Sunday %','Sunday In-Person','Sunday Online',
    'Prayer Present','Prayer Total','Prayer %','Prayer In-Person','Prayer Online',
    'Devotional Present','Devotional Total','Devotional %',
    'LC Present','LC Total','LC %',
    'BTLI Present','BTLI Total','BTLI %',
    'Pre-Pipeline Present','Pre-Pipeline Total','Pre-Pipeline %',
    'Ministry Present','Ministry Total','Ministry %','Ministry Breakdown',
    'Other Present','Other Total','Other Breakdown',
  ];
  lines.push(head.map(csvCell).join(','));
  // Session 9: CSV iterates over _scopedMembers() so the export honors
  // the same scope as the on-screen view. Previously it iterated over
  // STATE.members unconditionally — exporting church-wide data even
  // when the user was looking at "My LCG only". Silent leak fixed.
  _scopedMembers().forEach(m => {
    const b = buckets[m.id];
    // LCG display: use canonical pattern (Memory #17). Find this member's
    // LCG by walking up via discipler_id; the LCG row label uses lc_group
    // if set, else `${leader.firstName}'s LCG`.
    let lcgLabel = '(unassigned)';
    const did = m.discipler_id;
    if (did && STATE.leadersMap[did] && did !== m.id){
      lcgLabel = lcgDisplayName(STATE.leadersMap[did]);
    } else if (m.is_facilitator || m.facilitator_role){
      lcgLabel = lcgDisplayName(m) + ' (self)';
    }
    const role = m.is_facilitator ? (m.facilitator_role || 'LCL') : '';
    const row = [
      lcgLabel, m.name||'', m.pipeline_level ?? '', role,
      b.sunday.present, b.sunday.total, pctOrBlank(b.sunday), b.sunday.inPersonPresent, b.sunday.onlinePresent,
      b.prayer.present, b.prayer.total, pctOrBlank(b.prayer), b.prayer.inPersonPresent, b.prayer.onlinePresent,
      b.devo.present, b.devo.total, pctOrBlank(b.devo),
      b.lc.present, b.lc.total, pctOrBlank(b.lc),
      b.btli.present, b.btli.total, pctOrBlank(b.btli),
      b.prepip.present, b.prepip.total, pctOrBlank(b.prepip),
      b.minis.present, b.minis.total, pctOrBlank(b.minis),
        Object.keys(b.minis.breakdown).map(k => `${k} ${b.minis.breakdown[k].present}/${b.minis.breakdown[k].total}`).join(' | '),
      b.other.present, b.other.total,
        Object.keys(b.other.breakdownTotals).map(k => `${k} ${(b.other.breakdown[k]||0)}/${b.other.breakdownTotals[k]}`).join(' | '),
    ];
    lines.push(row.map(csvCell).join(','));
  });

  const csv = lines.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `member_attendance_${STATE.range.from}_to_${STATE.range.to}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function pctOrBlank(b){
  if (!b || b.total === 0) return '';
  return Math.min(100, Math.round((b.present / b.total) * 100));
}

function csvCell(v){
  if (v == null) return '';
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

// ─── Utility ──────────────────────────────────────────────────
function escHTML(s){
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s){ return escHTML(s); }

// ─── Back-link wiring ──────────────────────────────────────────
(function wireBack(){
  const ref = document.referrer || '';
  const back = document.getElementById('backLink');
  if (!back) return;
  if (ref && ref.includes('lc_leader_tool')){
    back.href = 'lc_leader_tool.html';
    back.textContent = '← MLT';
  } else {
    back.href = 'multiply_dashboard.html';
    back.textContent = '← Dashboard';
  }
})();

// ─── Init ──────────────────────────────────────────────────────

// Apply scope gating before first load (Session 9). For viewers below
// Coach (pipeline_level < 3), we hide the LCG-scope dropdown entirely
// and force scope to 'mine'. This way the rest of the code can treat
// scopeSel.value as the source of truth — when the dropdown is hidden,
// the value stays at the locked 'mine' option.
(function _applyScopeGate(){
  const sel = document.getElementById('scopeSel');
  if (!sel) return;
  if (!_viewerCanSeeAllLCGs()){
    sel.value = 'mine';
    sel.style.display = 'none';
    // Surface a small visible note in the topbar meta so the LCL knows
    // the report is scoped to their own LCG (not a bug). Appended at
    // first loadReport() once topMeta has content.
    sel.setAttribute('data-locked-mine', '1');
  }
})();

// ─── Member drill-down ─────────────────────────────────────────
// Click a member row → see the actual dates behind each ratio, and the
// full devotional reflection TEXT (lazy-loaded) so rubbish/blank/copy-paste
// "passes" are visible. Flags are mechanical hints only (length, repeats) —
// the pastor reads and decides, not the tool.
function _dmFmt(ymdStr){
  if(!ymdStr) return '';
  const dt = new Date(ymdStr + 'T00:00:00');
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'})
       + ' (' + dt.toLocaleDateString('en-US',{weekday:'short'}) + ')';
}
function dmDateChips(list, opts){
  opts = opts || {};
  if(!list.length) return '<div class="dm-none">— none in this window</div>';
  return '<div class="dm-chips">' + list.map(x => {
    let md = '';
    if(opts.showMode) md = x.mode==='online' ? '<span class="mode"> · 🌐</span>'
                         : (x.mode==='in_person' ? '<span class="mode"> · 🏛️</span>' : '');
    let nm = '';
    if(opts.showName && x.name) nm = ` <span class="lname">${escHTML(x.name)}</span>`;
    return `<span class="dm-chip">${_dmFmt(x.date)}${md}${nm}</span>`;
  }).join('') + '</div>';
}
function dmSection(title, cnt, inner){
  return `<div class="dm-sec"><div class="dm-sec-h">${escHTML(title)} <span class="cnt">${escHTML(cnt)}</span></div>${inner}</div>`;
}
function openMemberDetail(memberId){
  const m = (STATE.members||[]).find(x => x.id === memberId);
  if(!m) return;
  const present = (STATE.rows||[]).filter(r => r.member_id === memberId && r.present);
  const byType = (t) => present.filter(r => r.event_type === t)
      .map(r => ({ date:r.event_date, mode:r.attendance_mode, name:r.event_name }))
      .sort((a,b) => (b.date||'').localeCompare(a.date||''));
  const sun  = byType('Sunday Service');
  const wed  = byType('Prayer Meeting');
  const lc   = byType('LC Meeting');
  const btli = byType('BTLI');
  const pre  = byType('Pre-Pipeline');
  const KNOWN = new Set(['Sunday Service','Prayer Meeting','LC Meeting','BTLI','Pre-Pipeline','devotional']);
  const other = present.filter(r => !KNOWN.has(r.event_type))
      .map(r => ({ date:r.event_date, name:r.event_type }))
      .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const d = STATE.denoms || {};
  const initials = (m.name||'').split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase() || '?';
  const role  = m.is_facilitator ? (m.facilitator_role||'LCL') : '';
  const level = (m.pipeline_level != null) ? `L${m.pipeline_level}` : '';
  const meta  = [role, level].filter(Boolean).join(' · ');
  const rangeStr = `${STATE.range.from} → ${STATE.range.to}`;

  document.getElementById('detailModal').innerHTML = `
    <div class="dm-head">
      <div class="dm-av ${m.is_facilitator?'lcl':''}">${escHTML(initials)}</div>
      <div class="dm-title">
        <div class="dm-name">${escHTML(m.name||'(no name)')}</div>
        <div class="dm-meta">${meta?escHTML(meta)+' · ':''}${escHTML(rangeStr)}</div>
      </div>
      <button class="dm-x" onclick="closeMemberDetail()" title="Close">✕</button>
    </div>
    <div class="dm-body">
      ${dmSection('Sunday Service', `${sun.length}/${d.sunday??0}`, dmDateChips(sun,{showMode:true}))}
      ${dmSection('Prayer Meeting (Wed)', `${wed.length}/${d.prayer??0}`, dmDateChips(wed,{showMode:true}))}
      ${dmSection('LC Meeting', `${lc.length}/${d.lc??0} weeks`, dmDateChips(lc,{}))}
      ${dmSection('BTLI lessons', `${btli.length}/${d.btli??0}`, dmDateChips(btli,{showName:true}))}
      ${dmSection('Pre-Pipeline lessons', `${pre.length}/${d.prepip??0}`, dmDateChips(pre,{showName:true}))}
      ${other.length ? dmSection('Ministry / Other', `${other.length}`, dmDateChips(other,{showName:true})) : ''}
      <div class="dm-sec">
        <div class="dm-sec-h">Devotional reflections <span class="cnt" id="dmDevoCnt"></span></div>
        <div class="dm-loading" id="dmDevoBody">Loading reflections…</div>
      </div>
    </div>`;
  document.getElementById('detailOverlay').classList.add('show');
  if(document.documentElement.classList.contains('embed'))window.scrollTo(0,0);
  document.body.style.overflow = 'hidden';
  _dmLoadReflections(memberId);
}
async function _dmLoadReflections(memberId){
  const bodyEl = document.getElementById('dmDevoBody');
  const cntEl  = document.getElementById('dmDevoCnt');
  try{
    const { data, error } = await db.from('devotional_reflections')
      .select('entry_date,reflection')
      .eq('member_id', memberId)
      .gte('entry_date', STATE.range.from)
      .lte('entry_date', STATE.range.to)
      .order('entry_date', { ascending:false });
    if(error) throw error;
    if(!document.getElementById('dmDevoBody')) return; // modal closed
    const refls = data || [];
    const denom = (STATE.denoms && STATE.denoms.devo) || 0;
    if(cntEl) cntEl.textContent = `${refls.length}/${denom}`;
    if(!refls.length){
      document.getElementById('dmDevoBody').outerHTML =
        '<div class="dm-none" id="dmDevoBody">— no reflections saved in this window</div>';
      return;
    }
    // Duplicate detection: identical normalized text on more than one day.
    const norm = s => (s||'').trim().toLowerCase().replace(/\s+/g,' ');
    const counts = {};
    refls.forEach(r => { const k = norm(r.reflection); if(k) counts[k] = (counts[k]||0)+1; });
    const html = refls.map(r => {
      const text = r.reflection || '';
      const trimmed = text.trim();
      const chars = trimmed.length;
      const words = trimmed ? trimmed.split(/\s+/).length : 0;
      const flags = [];
      if(chars === 0)      flags.push('<span class="dm-flag blank">⚠ blank</span>');
      else if(chars < 15)  flags.push('<span class="dm-flag short">⚠ very short</span>');
      const k = norm(text);
      if(k && counts[k] > 1) flags.push(`<span class="dm-flag dup">↺ repeated ×${counts[k]}</span>`);
      return `<div class="dm-refl">
        <div class="dm-refl-top">
          <span class="dm-refl-date">${_dmFmt(r.entry_date)}</span>
          <span class="dm-refl-meta">${words} word${words===1?'':'s'} · ${chars} char${chars===1?'':'s'}</span>
          ${flags.join('')}
        </div>
        <div class="dm-refl-text">${chars ? escHTML(text) : '<em>(empty)</em>'}</div>
      </div>`;
    }).join('');
    document.getElementById('dmDevoBody').outerHTML = `<div id="dmDevoBody">${html}</div>`;
  }catch(e){
    console.warn('[member_attendance_report] reflection load failed:', e);
    const el = document.getElementById('dmDevoBody');
    if(el) el.textContent = 'Could not load reflections.';
  }
}
function closeMemberDetail(){
  const ov = document.getElementById('detailOverlay');
  if(ov) ov.classList.remove('show');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMemberDetail(); });

loadReport();

</script>
