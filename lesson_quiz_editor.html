<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson Quiz Editor · MULTIPLY</title>
<link rel="icon" href="favicon_300.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --surface2:#f0ede5;
  --border:#d8d2c4;
  --text:#1f2b24;
  --text-dim:#475a4f;
  --muted:#6b7a72;
  --gold:#a07a28;
  --gold-dim:#7d5e1e;
  --green:#3d6b3a;
  --green-bright:#5a9551;
  --red:#a04a3d;
  --blue:#3d6b8c;
  --warn:#a07a28;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  visibility:hidden;
}
body.leader-authenticated{visibility:visible;}

/* Gate blackout (matches MD/MLT pattern) */
#leaderGateBlackout{
  position:fixed;inset:0;background:#f7f5f0;z-index:99999;
  display:flex;align-items:center;justify-content:center;color:#6b7a72;font-size:13px;
}

.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.topbar-title{
  font-size:17px;font-weight:800;letter-spacing:-.01em;
  display:flex;align-items:center;gap:10px;
}
.topbar-meta{font-size:11.5px;color:var(--muted);font-weight:500;}
.back-btn{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);
  padding:7px 13px;border-radius:8px;
  font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;
}
.back-btn:hover{background:var(--border);}

.container{
  max-width:980px;margin:0 auto;padding:20px;
}

/* Table toggle */
.toggle-row{
  display:flex;gap:8px;margin-bottom:18px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;padding:6px;
}
.toggle-btn{
  flex:1;padding:11px 16px;border:none;background:transparent;
  color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;
  border-radius:7px;transition:background .15s,color .15s;
  font-family:inherit;
}
.toggle-btn.active{
  background:var(--green);color:#fff;
}
.toggle-btn:hover:not(.active){
  background:var(--surface2);color:var(--text);
}

/* Picker row */
.picker-row{
  display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:18px;align-items:end;
}
@media(max-width:540px){
  .picker-row{grid-template-columns:1fr;}
}
.field-label{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:6px;display:block;
}
select.quiz-picker,input.text-input,textarea.text-input{
  width:100%;
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  font-size:13.5px;
  font-family:inherit;
  line-height:1.5;
}
select.quiz-picker{cursor:pointer;}
textarea.text-input{resize:vertical;min-height:80px;line-height:1.6;}
input.text-input:focus,select.quiz-picker:focus,textarea.text-input:focus{
  outline:none;border-color:var(--green-bright);
}
input.text-input:disabled,input.text-input[readonly],
textarea.text-input:disabled,textarea.text-input[readonly]{
  opacity:1;
  -webkit-text-fill-color:var(--text-dim);
  color:var(--text-dim);
  background:#ebe6d8;
  cursor:not-allowed;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:8px;
  border:none;cursor:pointer;
  font-size:13px;font-weight:700;
  font-family:inherit;
  transition:filter .12s,background .15s;
}
.btn:hover{filter:brightness(1.08);}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none;}
.btn-primary{background:var(--green);color:#fff;}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--red);color:#fff;}
.btn-warn{background:var(--warn);color:#1a1208;}

.editor-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px 20px;
  margin-bottom:14px;
}
.editor-card-title{
  font-size:14px;font-weight:800;
  margin:0 0 14px 0;
  display:flex;align-items:center;gap:8px;
}
.editor-card-title .pill{
  font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--surface2);color:var(--muted);
  padding:2px 7px;border-radius:5px;
}
.field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.field-grid-2{grid-template-columns:1fr;}}

.field-row{margin-bottom:14px;}
.field-row:last-child{margin-bottom:0;}
.helper{
  font-size:11px;color:var(--muted);
  margin-top:5px;line-height:1.5;
}
.helper code{
  background:var(--surface2);padding:1px 5px;border-radius:3px;
  font-family:monospace;font-size:11px;color:var(--gold);
}

/* Toggle switch for is_active */
.switch-row{display:flex;align-items:center;gap:10px;}
.switch{
  position:relative;display:inline-block;width:42px;height:24px;
  flex-shrink:0;
}
.switch input{opacity:0;width:0;height:0;}
.slider{
  position:absolute;cursor:pointer;inset:0;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:24px;transition:.2s;
}
.slider:before{
  position:absolute;content:"";height:16px;width:16px;
  left:3px;top:50%;transform:translateY(-50%);
  background:var(--muted);border-radius:50%;transition:.2s;
}
.switch input:checked + .slider{background:var(--green);border-color:var(--green);}
.switch input:checked + .slider:before{transform:translate(18px,-50%);background:#fff;}
.switch-label{font-size:13px;font-weight:600;}

.action-bar{
  display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
  padding:14px 0 4px;
  border-top:1px solid var(--border);margin-top:6px;
}
@media(max-width:540px){
  .action-bar{justify-content:stretch;}
  .action-bar .btn{flex:1;}
}

.empty-state{
  text-align:center;padding:50px 20px;
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:12px;
  color:var(--muted);
}
.empty-state .emoji{font-size:32px;margin-bottom:10px;}

.toast-host{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  z-index:9999;pointer-events:none;
}
.toast{
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 18px;border-radius:10px;
  font-size:13px;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:flex;align-items:center;gap:8px;
  animation:toastIn .25s ease-out;
}
.toast.success{border-color:var(--green-bright);}
.toast.warn{border-color:var(--warn);}
.toast.err{border-color:var(--red);}
@keyframes toastIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}

.phase2-stub{
  background:var(--surface2);
  border:1px dashed var(--border);
  border-radius:10px;padding:16px;
  color:var(--muted);font-size:12.5px;line-height:1.6;
}
.phase2-stub strong{color:var(--gold);}

.dirty-indicator{
  display:none;
  color:var(--warn);font-size:11px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;
}
.dirty-indicator.visible{display:inline-flex;align-items:center;gap:4px;}

/* ── Questions editor ── */
.q-card{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px 16px;
  margin-bottom:10px;
}
.q-card-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:10px;flex-wrap:wrap;
}
.q-card-title{
  font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.q-type-pill{
  font-size:10px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;
  padding:2px 7px;border-radius:5px;
}
.q-type-pill.mc{background:rgba(126,166,111,.18);color:var(--green-bright);}
.q-type-pill.tf{background:rgba(90,135,176,.18);color:var(--blue);}
.q-actions{display:flex;gap:5px;}
.q-icon-btn{
  background:transparent;border:1px solid var(--border);
  color:var(--muted);
  width:28px;height:28px;border-radius:6px;
  cursor:pointer;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s,border-color .12s;
}
.q-icon-btn:hover{background:var(--border);color:var(--text);}
.q-icon-btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red);}
.q-icon-btn:disabled{opacity:.3;cursor:not-allowed;}
.q-icon-btn:disabled:hover{background:transparent;color:var(--muted);}

.q-stem-row{margin-bottom:10px;}
.q-stem-row textarea{
  width:100%;background:var(--bg);color:var(--text);
  border:1px solid var(--border);border-radius:7px;
  padding:8px 10px;font-family:inherit;font-size:13px;line-height:1.5;
  resize:vertical;min-height:50px;
}
.q-stem-row textarea:focus{outline:none;border-color:var(--green-bright);}
.q-stem-label{
  font-size:10.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--muted);
  display:block;margin-bottom:4px;
}

.q-options{margin-top:6px;}
.q-option{
  display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:start;
  padding:8px;border-radius:7px;
  background:var(--bg);
  border:1px solid var(--border);
  margin-bottom:6px;
}
.q-option.correct{
  border-color:var(--green-bright);
  background:rgba(126,166,111,.07);
}
@media(max-width:600px){
  .q-option{grid-template-columns:auto 1fr auto;}
  .q-option > .q-opt-tl{grid-column:1 / -1;margin-left:30px;}
}
.q-option input[type="radio"]{
  margin-top:8px;
  accent-color:var(--green-bright);
  cursor:pointer;
}
.q-option input[type="text"]{
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:5px;
  padding:6px 9px;font-family:inherit;font-size:12.5px;
  width:100%;
}
.q-option input[type="text"]:focus{outline:none;border-color:var(--green-bright);}

.q-tf-row{
  display:flex;gap:8px;margin-top:8px;
}
.q-tf-opt{
  flex:1;padding:10px 14px;border-radius:7px;
  border:1px solid var(--border);background:var(--bg);
  cursor:pointer;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;
  transition:background .12s,border-color .12s,color .12s;
}
.q-tf-opt input[type="radio"]{
  accent-color:var(--green-bright);
  cursor:pointer;
}
.q-tf-opt.selected{
  border-color:var(--green-bright);
  background:rgba(126,166,111,.10);
  color:var(--text);
}

.q-empty{
  text-align:center;padding:24px 16px;
  border:1px dashed var(--border);
  border-radius:10px;
  color:var(--muted);font-size:13px;
}

</style>
</head>
<body>

<div id="leaderGateBlackout">Checking session…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="multiply_shared.js?v=7"></script>
<script>
// ─── Session gate (matches MD/MLT pattern) ─────────────────────
(function leaderGateBoot(){
  if (!window.MultiplyShared) {
    location.replace('leader_login.html');
    return;
  }
  if (!MultiplyShared.gateOrRedirect('leader_login.html')) return;
  // Pastor-only page
  const L = window.LEADER || {};
  const PASTOR_LEVEL = MultiplyShared.PASTOR_LEVEL || 5;
  if ((L.leaderLevel || 0) < PASTOR_LEVEL) {
    alert('Lesson Quiz Editor is restricted to Pastor-level access.');
    location.replace('multiply_dashboard.html');
    return;
  }
  document.body.classList.add('leader-authenticated');
  const blackout = document.getElementById('leaderGateBlackout');
  if (blackout) blackout.remove();
})();
</script>

<!-- ── TOPBAR ── -->
<div class="topbar">
  <div>
    <div class="topbar-title">
      <span>📝</span>
      <span>Lesson Quiz Editor</span>
      <span id="dirtyIndicator" class="dirty-indicator">● Unsaved changes</span>
    </div>
    <div class="topbar-meta">Direct table editor for Usbong &amp; BTLI lesson quizzes · Pastor-only</div>
  </div>
  <a href="multiply_dashboard.html" class="back-btn">← Dashboard</a>
</div>

<div class="container">

  <!-- ── TABLE TOGGLE ── -->
  <div class="toggle-row" role="tablist" aria-label="Quiz table">
    <button class="toggle-btn active" id="tabUsbong" onclick="switchTable('usbong')" role="tab" aria-selected="true">
      🌱 Usbong Quizzes
    </button>
    <button class="toggle-btn" id="tabBtli" onclick="switchTable('btli')" role="tab" aria-selected="false">
      🎓 BTLI Quizzes
    </button>
  </div>

  <!-- ── QUIZ ROW PICKER ── -->
  <div class="picker-row">
    <div>
      <label class="field-label" for="quizPicker">Select Quiz</label>
      <select id="quizPicker" class="quiz-picker" onchange="onQuizPickerChange()">
        <option value="">— Loading… —</option>
      </select>
    </div>
    <div style="align-self:end">
      <button class="btn btn-secondary" onclick="reloadList()" title="Refresh list from database">🔄 Refresh</button>
    </div>
  </div>

  <!-- ── EDITOR HOST ── -->
  <div id="editorHost">
    <div class="empty-state">
      <div class="emoji">📋</div>
      <div>Pick a quiz above to edit, or refresh the list.</div>
    </div>
  </div>

</div>

<div class="toast-host" id="toastHost"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// LESSON QUIZ EDITOR — Phase 1
// ═══════════════════════════════════════════════════════════════
// Unified editor for usbong_quizzes + btli_quizzes (Family A — both
// share an identical 15-column schema). Library quizzes have a
// different bilingual model (column-level _en/_tl pairs) and are
// edited via the in-MD Library Quiz Builder, not here.
//
// Phase 1 (this build): flat-field editor for all columns EXCEPT
//   the `questions` JSONB. Pastor can edit lesson_title, passing_score,
//   intro_text, outro_pass_text, outro_fail_text, attendance_event_name_pattern,
//   and toggle is_active. Course_code and lesson_number are read-only
//   identifiers (changing them is a structural move, not an edit).
//
// Phase 2 (next session): questions JSONB editor with question cards,
//   bilingual EN/TL stems, MC option editor, TF answer toggle, reorder/
//   delete/add. Stubbed in this build with a clear marker.
//
// Direct-table-as-source-of-truth — no parser layer, no bulk-import
// format, just the actual stored columns in editable inputs.
// ═══════════════════════════════════════════════════════════════

const db = MultiplyShared.getDB();

const STATE = {
  table: 'usbong',           // 'usbong' | 'btli'
  list: [],                  // [{id,course_code,lesson_number,lesson_title,is_active}]
  selectedId: null,
  selected: null,            // full row
  draft: null,               // working copy for edit
  dirty: false,
  saving: false,
};

const TABLE_MAP = {
  usbong: { table: 'usbong_quizzes', label: '🌱 Usbong' },
  btli:   { table: 'btli_quizzes',   label: '🎓 BTLI' },
};

// ─── Toast helper ──────────────────────────────────────────────
function toast(msg, kind){
  const host = document.getElementById('toastHost');
  if (!host) return;
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transition = 'opacity .25s';
    setTimeout(() => t.remove(), 280);
  }, 2400);
}

// ─── Dirty tracking ────────────────────────────────────────────
function setDirty(d){
  STATE.dirty = !!d;
  const el = document.getElementById('dirtyIndicator');
  if (el) el.classList.toggle('visible', !!d);
}

// Warn on unload if dirty
window.addEventListener('beforeunload', (e) => {
  if (STATE.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ─── Table toggle ──────────────────────────────────────────────
function switchTable(which){
  if (STATE.dirty) {
    if (!confirm('You have unsaved changes. Discard and switch tables?')) return;
    setDirty(false);
  }
  STATE.table = which;
  STATE.selectedId = null;
  STATE.selected = null;
  STATE.draft = null;
  document.getElementById('tabUsbong').classList.toggle('active', which === 'usbong');
  document.getElementById('tabUsbong').setAttribute('aria-selected', which === 'usbong');
  document.getElementById('tabBtli').classList.toggle('active', which === 'btli');
  document.getElementById('tabBtli').setAttribute('aria-selected', which === 'btli');
  renderEditor();
  loadList();
}

// ─── Load list ─────────────────────────────────────────────────
async function loadList(){
  const tbl = TABLE_MAP[STATE.table].table;
  const picker = document.getElementById('quizPicker');
  picker.innerHTML = '<option value="">— Loading… —</option>';
  try {
    const { data, error } = await db.from(tbl)
      .select('id, course_code, lesson_number, lesson_title, is_active')
      .order('course_code', { ascending: true })
      .order('lesson_number', { ascending: true });
    if (error) throw error;
    STATE.list = data || [];
    renderPickerOptions();
  } catch (e) {
    picker.innerHTML = '<option value="">— Error loading —</option>';
    toast('Could not load quiz list: ' + (e.message || e), 'err');
    console.error('[lesson_quiz_editor] loadList error', e);
  }
}

function renderPickerOptions(){
  const picker = document.getElementById('quizPicker');
  if (!STATE.list.length) {
    picker.innerHTML = '<option value="">— No quizzes in this table —</option>';
    return;
  }
  const opts = ['<option value="">— Pick a quiz —</option>'];
  // Group by course_code for readability
  const byCourse = {};
  STATE.list.forEach(r => {
    const cc = r.course_code || '(no course_code)';
    if (!byCourse[cc]) byCourse[cc] = [];
    byCourse[cc].push(r);
  });
  Object.keys(byCourse).sort().forEach(cc => {
    opts.push(`<optgroup label="${escHTML(cc)}">`);
    byCourse[cc].forEach(r => {
      const inactive = !r.is_active ? ' · inactive' : '';
      const ln = (r.lesson_number != null) ? `L${r.lesson_number} · ` : '';
      const label = `${ln}${escHTML(r.lesson_title || '(untitled)')}${inactive}`;
      const sel = (r.id === STATE.selectedId) ? ' selected' : '';
      opts.push(`<option value="${r.id}"${sel}>${label}</option>`);
    });
    opts.push('</optgroup>');
  });
  picker.innerHTML = opts.join('');
}

function escHTML(s){
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Picker change ─────────────────────────────────────────────
async function onQuizPickerChange(){
  const id = document.getElementById('quizPicker').value;
  if (!id) {
    STATE.selectedId = null;
    STATE.selected = null;
    STATE.draft = null;
    renderEditor();
    return;
  }
  if (STATE.dirty) {
    if (!confirm('You have unsaved changes. Discard and switch quizzes?')) {
      // revert picker to previous selection
      document.getElementById('quizPicker').value = STATE.selectedId || '';
      return;
    }
    setDirty(false);
  }
  STATE.selectedId = id;
  await loadFullRow(id);
}

async function loadFullRow(id){
  const tbl = TABLE_MAP[STATE.table].table;
  try {
    const { data, error } = await db.from(tbl).select('*').eq('id', id).single();
    if (error) throw error;
    STATE.selected = data;
    STATE.draft = { ...data };
    _normalizeQuizForEditor(STATE.draft.questions);
    renderEditor();
  } catch (e) {
    toast('Could not load quiz: ' + (e.message || e), 'err');
    console.error('[lesson_quiz_editor] loadFullRow error', e);
  }
}

// ─── Reload list (manual refresh) ──────────────────────────────
async function reloadList(){
  if (STATE.dirty) {
    if (!confirm('You have unsaved changes. Discard and refresh?')) return;
    setDirty(false);
    STATE.selectedId = null;
    STATE.selected = null;
    STATE.draft = null;
    renderEditor();
  }
  await loadList();
  toast('List refreshed', 'success');
}

// ─── Render editor ─────────────────────────────────────────────
// ── Option-key normalization (fixes label_en/label_tl ⇄ en/tl drift) ──
// DB canonical option shape is {correct, label_en, label_tl}; the editor UI
// works in {en, tl, correct}. Backfill on load so real answers display + edit;
// re-emit canonical labels on save so the stored shape — and the member quiz
// player, which reads label_en/label_tl — is preserved. No data is renamed in DB.
function _normalizeQuizForEditor(questions){
  if (Array.isArray(questions)) questions.forEach(function(q){
    if (q && Array.isArray(q.options)) q.options.forEach(function(o){
      if (o.en == null && o.label_en != null) o.en = o.label_en;
      if (o.tl == null && o.label_tl != null) o.tl = o.label_tl;
      if (o.en == null) o.en = '';
      if (o.tl == null) o.tl = '';
    });
  });
  return questions;
}
function _serializeQuizForSave(questions){
  return (Array.isArray(questions) ? questions : []).map(function(q){
    if (q && Array.isArray(q.options)){
      var opts = q.options.map(function(o){
        var out = {};
        for (var k in o){ if (k !== 'en' && k !== 'tl') out[k] = o[k]; }
        out.label_en = (o.en != null ? o.en : (o.label_en || ''));
        out.label_tl = (o.tl != null ? o.tl : (o.label_tl || ''));
        return out;
      });
      var nq = {}; for (var k in q){ if (k !== 'options') nq[k] = q[k]; } nq.options = opts;
      return nq;
    }
    return q;
  });
}

// ─── Field change handler ──────────────────────────────────────
function onFieldChange(key, value){
  if (!STATE.draft) return;
  STATE.draft[key] = value;
  setDirty(true);
  // Update the is_active label inline if it's that field
  if (key === 'is_active') {
    const lbl = document.getElementById('fldActiveLabel');
    if (lbl) lbl.textContent = value ? 'Active — visible to disciples' : 'Inactive — hidden from disciples';
  }
}

// ═══════════════════════════════════════════════════════════════
// QUESTIONS EDITOR — Phase 2
// ═══════════════════════════════════════════════════════════════
// JSONB shape (verified from a live usbong_quizzes row, May 19, 2026):
//   MC: { type:"mc", question_en, question_tl, options:[{en,tl,correct}, ...] }
//   TF: { type:"tf", question_en, question_tl, correct:bool }
// We mutate STATE.draft.questions in-place and re-render the questions
// list only (not the whole editor — preserves focus on flat fields).

function renderQuestionsList(questions){
  if (!Array.isArray(questions) || questions.length === 0) {
    return '<div class="q-empty">No questions yet. Use the buttons below to add one.</div>';
  }
  return questions.map((q, idx) => renderQuestionCard(q, idx, questions.length)).join('');
}

function renderQuestionCard(q, idx, total){
  const type = q.type === 'tf' ? 'tf' : 'mc';
  const typeLabel = type === 'tf' ? 'True / False' : 'Multiple Choice';
  const stemEn = q.question_en || '';
  const stemTl = q.question_tl || '';

  let bodyHTML = '';
  if (type === 'mc') {
    const options = Array.isArray(q.options) ? q.options : [];
    bodyHTML = `
      <div class="q-stem-label" style="margin-top:8px">Options (mark exactly one correct)</div>
      <div class="q-options">
        ${options.map((opt, oIdx) => `
          <div class="q-option ${opt.correct ? 'correct' : ''}">
            <input type="radio" name="qCorrect_${idx}" ${opt.correct ? 'checked' : ''}
              onchange="setMCCorrect(${idx}, ${oIdx})" title="Mark as correct">
            <input type="text" class="q-opt-en" placeholder="Option ${oIdx+1} (English)"
              value="${escHTML(opt.en || '')}"
              oninput="setMCOption(${idx}, ${oIdx}, 'en', this.value)">
            <input type="text" class="q-opt-tl" placeholder="Tagalog (optional)"
              value="${escHTML(opt.tl || '')}"
              oninput="setMCOption(${idx}, ${oIdx}, 'tl', this.value)">
            <button class="q-icon-btn danger" onclick="removeMCOption(${idx}, ${oIdx})"
              ${options.length <= 2 ? 'disabled title="At least 2 options required"' : 'title="Remove option"'}>×</button>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-secondary" style="margin-top:6px;padding:6px 12px;font-size:12px"
        onclick="addMCOption(${idx})">+ Add Option</button>
    `;
  } else {
    const isTrue = q.correct === true;
    const isFalse = q.correct === false;
    bodyHTML = `
      <div class="q-stem-label" style="margin-top:8px">Correct Answer</div>
      <div class="q-tf-row">
        <label class="q-tf-opt ${isTrue ? 'selected' : ''}">
          <input type="radio" name="qTfCorrect_${idx}" ${isTrue ? 'checked' : ''}
            onchange="setTFCorrect(${idx}, true)">
          ✓ True
        </label>
        <label class="q-tf-opt ${isFalse ? 'selected' : ''}">
          <input type="radio" name="qTfCorrect_${idx}" ${isFalse ? 'checked' : ''}
            onchange="setTFCorrect(${idx}, false)">
          ✗ False
        </label>
      </div>
    `;
  }

  return `
    <div class="q-card" data-q-idx="${idx}">
      <div class="q-card-header">
        <div class="q-card-title">
          Question ${idx+1}
          <span class="q-type-pill ${type}">${typeLabel}</span>
        </div>
        <div class="q-actions">
          <button class="q-icon-btn" onclick="moveQuestion(${idx}, -1)"
            ${idx === 0 ? 'disabled' : ''} title="Move up">↑</button>
          <button class="q-icon-btn" onclick="moveQuestion(${idx}, 1)"
            ${idx === total - 1 ? 'disabled' : ''} title="Move down">↓</button>
          <button class="q-icon-btn danger" onclick="deleteQuestion(${idx})" title="Delete question">🗑</button>
        </div>
      </div>
      <div class="q-stem-row">
        <label class="q-stem-label">Question (English)</label>
        <textarea oninput="setStem(${idx}, 'en', this.value)" placeholder="Enter the question in English">${escHTML(stemEn)}</textarea>
      </div>
      <div class="q-stem-row">
        <label class="q-stem-label">Question (Tagalog)</label>
        <textarea oninput="setStem(${idx}, 'tl', this.value)" placeholder="I-Tagalog ang tanong">${escHTML(stemTl)}</textarea>
      </div>
      ${bodyHTML}
    </div>
  `;
}

function reRenderQuestions(){
  const host = document.getElementById('questionsList');
  if (!host || !STATE.draft) return;
  const qs = STATE.draft.questions || [];
  host.innerHTML = renderQuestionsList(qs);
  // Update the count pill in the card title
  const allCards = document.querySelectorAll('.editor-card-title .pill');
  // The questions card title is the last .pill inside an editor-card whose title contains "Questions"
  document.querySelectorAll('.editor-card').forEach(card => {
    const title = card.querySelector('.editor-card-title');
    if (title && /Questions/.test(title.textContent)) {
      const pill = title.querySelector('.pill');
      if (pill) pill.textContent = `${qs.length} item${qs.length === 1 ? '' : 's'}`;
    }
  });
}

function markQuestionsDirty(){
  setDirty(true);
}

// ─── Stem editing (EN/TL) ──────────────────────────────────────
function setStem(idx, lang, value){
  if (!STATE.draft || !STATE.draft.questions || !STATE.draft.questions[idx]) return;
  const key = lang === 'tl' ? 'question_tl' : 'question_en';
  STATE.draft.questions[idx][key] = value;
  markQuestionsDirty();
  // No re-render here — we don't want to clobber the textarea the user is typing in
}

// ─── MC option editing ─────────────────────────────────────────
function setMCOption(qIdx, oIdx, lang, value){
  const q = STATE.draft?.questions?.[qIdx];
  if (!q || !Array.isArray(q.options) || !q.options[oIdx]) return;
  const key = lang === 'tl' ? 'tl' : 'en';
  q.options[oIdx][key] = value;
  markQuestionsDirty();
}

function setMCCorrect(qIdx, oIdx){
  const q = STATE.draft?.questions?.[qIdx];
  if (!q || !Array.isArray(q.options)) return;
  q.options.forEach((opt, i) => { opt.correct = (i === oIdx); });
  markQuestionsDirty();
  reRenderQuestions(); // re-render to update the .correct visual highlight
}

function addMCOption(qIdx){
  const q = STATE.draft?.questions?.[qIdx];
  if (!q || !Array.isArray(q.options)) return;
  if (q.options.length >= 6) {
    toast('Max 6 options per question', 'warn');
    return;
  }
  q.options.push({ en: '', tl: '', correct: false });
  markQuestionsDirty();
  reRenderQuestions();
}

function removeMCOption(qIdx, oIdx){
  const q = STATE.draft?.questions?.[qIdx];
  if (!q || !Array.isArray(q.options)) return;
  if (q.options.length <= 2) {
    toast('At least 2 options required', 'warn');
    return;
  }
  const wasCorrect = q.options[oIdx]?.correct;
  q.options.splice(oIdx, 1);
  // If we removed the correct option, mark the first remaining one as correct
  if (wasCorrect && !q.options.some(o => o.correct)) {
    q.options[0].correct = true;
  }
  markQuestionsDirty();
  reRenderQuestions();
}

// ─── TF answer editing ─────────────────────────────────────────
function setTFCorrect(qIdx, val){
  const q = STATE.draft?.questions?.[qIdx];
  if (!q) return;
  q.correct = !!val;
  markQuestionsDirty();
  reRenderQuestions(); // update visual selected state
}

// ─── Question-level operations ─────────────────────────────────
function addQuestion(type){
  if (!STATE.draft) return;
  if (!Array.isArray(STATE.draft.questions)) STATE.draft.questions = [];
  if (type === 'tf') {
    STATE.draft.questions.push({
      type: 'tf',
      question_en: '',
      question_tl: '',
      correct: true,
    });
  } else {
    STATE.draft.questions.push({
      type: 'mc',
      question_en: '',
      question_tl: '',
      options: [
        { en: '', tl: '', correct: true },
        { en: '', tl: '', correct: false },
        { en: '', tl: '', correct: false },
        { en: '', tl: '', correct: false },
      ],
    });
  }
  markQuestionsDirty();
  reRenderQuestions();
  // Scroll the new card into view
  setTimeout(() => {
    const cards = document.querySelectorAll('.q-card');
    const last = cards[cards.length - 1];
    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

function deleteQuestion(idx){
  if (!STATE.draft?.questions?.[idx]) return;
  const q = STATE.draft.questions[idx];
  const label = q.question_en ? `"${q.question_en.slice(0, 60)}${q.question_en.length > 60 ? '…' : ''}"` : `Question ${idx+1}`;
  if (!confirm(`Delete ${label}?\n\nThis cannot be undone unless you Cancel without saving.`)) return;
  STATE.draft.questions.splice(idx, 1);
  markQuestionsDirty();
  reRenderQuestions();
}

function moveQuestion(idx, dir){
  if (!STATE.draft?.questions) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= STATE.draft.questions.length) return;
  const arr = STATE.draft.questions;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  markQuestionsDirty();
  reRenderQuestions();
}

// ─── Validation before save ────────────────────────────────────
function validateQuestions(questions){
  if (!Array.isArray(questions)) return null; // empty array or missing is fine
  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    const label = `Question ${i+1}`;
    if (!q || typeof q !== 'object') return `${label}: malformed entry`;
    if (q.type !== 'mc' && q.type !== 'tf') return `${label}: unknown type "${q.type}" (must be mc or tf)`;
    if (!q.question_en || !q.question_en.trim()) return `${label}: English question text is required`;
    if (q.type === 'mc') {
      if (!Array.isArray(q.options) || q.options.length < 2) return `${label}: needs at least 2 options`;
      const correctCount = q.options.filter(o => o && o.correct).length;
      if (correctCount === 0) return `${label}: mark exactly one option as correct`;
      if (correctCount > 1) return `${label}: only one option can be marked correct (found ${correctCount})`;
      // Every option needs at least English text
      for (let j = 0; j < q.options.length; j++) {
        const opt = q.options[j];
        if (!opt || !opt.en || !opt.en.trim()) return `${label}, Option ${j+1}: English text is required`;
      }
    } else { // tf
      if (q.correct !== true && q.correct !== false) return `${label}: pick True or False as the correct answer`;
    }
  }
  return null;
}

// ─── Cancel ────────────────────────────────────────────────────
function cancelEdit(){
  if (!STATE.dirty) {
    // Nothing to undo — just close the editor
    STATE.draft = null;
    STATE.selected = null;
    STATE.selectedId = null;
    document.getElementById('quizPicker').value = '';
    renderEditor();
    return;
  }
  if (!confirm('Discard unsaved changes?')) return;
  // Revert draft to the last loaded copy
  STATE.draft = { ...STATE.selected };
  setDirty(false);
  renderEditor();
}

// ─── Save ──────────────────────────────────────────────────────
async function saveEdit(){
  if (!STATE.draft || !STATE.selectedId) return;
  if (STATE.saving) return;

  // Validate questions before saving — surface problems clearly so Pastor
  // can fix them, rather than silently shipping a broken quiz JSONB.
  const validationErr = validateQuestions(STATE.draft.questions);
  if (validationErr) {
    toast('⚠️ ' + validationErr, 'warn');
    return;
  }

  STATE.saving = true;
  const btn = document.getElementById('saveBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  const tbl = TABLE_MAP[STATE.table].table;
  const d = STATE.draft;

  // Build payload — ONLY editable Phase 1 fields. Identifiers, the
  // attendance_event_name_pattern (a structural eligibility key per
  // Invariant #53), and the questions JSONB are NOT touched in this
  // editor, so existing data is preserved.
  const payload = {
    lesson_title: (d.lesson_title || '').trim() || null,
    passing_score: (d.passing_score != null && !isNaN(d.passing_score)) ? d.passing_score : 70,
    intro_text: d.intro_text || null,
    outro_pass_text: d.outro_pass_text || null,
    outro_fail_text: d.outro_fail_text || null,
    is_active: !!d.is_active,
    updated_at: new Date().toISOString(),
  };

  // Also save questions JSONB if it was edited in Phase 2
  if (Array.isArray(d.questions)) {
    payload.questions = _serializeQuizForSave(d.questions);
  }

  // Optional: stamp updated_by if available
  const L = window.LEADER || {};
  if (L.leaderId) payload.updated_by = L.leaderId;

  try {
    const { data, error } = await db.from(tbl)
      .update(payload)
      .eq('id', STATE.selectedId)
      .select()
      .single();
    if (error) throw error;
    STATE.selected = data;
    STATE.draft = { ...data };
    _normalizeQuizForEditor(STATE.draft.questions);
    setDirty(false);
    toast('✓ Saved', 'success');
    // Refresh the list so the picker label reflects new title/active state
    await loadList();
    renderEditor();
  } catch (e) {
    toast('Save failed: ' + (e.message || e), 'err');
    console.error('[lesson_quiz_editor] save error', e);
  } finally {
    STATE.saving = false;
    const b = document.getElementById('saveBtn');
    if (b) { b.disabled = false; b.textContent = '💾 Save Changes'; }
  }
}

// ─── Init ──────────────────────────────────────────────────────
loadList();

</script>
