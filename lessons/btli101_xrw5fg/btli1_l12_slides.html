<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:#0a1424;color:#fff;
  font-family:'DM Sans',sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;height:100vh;
}

:root{
  --navy:#0a1424;
  --navy2:#1b2a4a;
  --navy3:#2a3e6b;
  --gold:#d4a84a;
  --gold2:#f0c870;
  --gold-dim:#8a6a28;
  --cream:#f5edd8;
  --ink-soft:rgba(245,237,216,.85);
  --muted:rgba(245,237,216,.55);
  --line:rgba(212,168,74,.25);
}

/* ─────────── STAGE (16:9) ─────────── */
.stage{
  position:relative;width:100vw;height:100vh;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5vh 8vw;
  opacity:0;visibility:hidden;
  transition:opacity .6s ease, visibility .6s;
  text-align:center;
}
.slide.active{opacity:1;visibility:visible;}

/* ─────────── CONTROLS (only visible on hover) ─────────── */
.controls{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;gap:10px;align-items:center;
  background:rgba(10,20,36,.7);backdrop-filter:blur(10px);
  padding:10px 16px;border-radius:999px;
  opacity:0;transition:opacity .3s;z-index:100;
  border:1px solid rgba(212,168,74,.18);
}
body:hover .controls{opacity:1;}
.ctrl-btn{
  background:none;border:none;color:var(--cream);cursor:pointer;
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;transition:background .15s;
}
.ctrl-btn:hover{background:rgba(212,168,74,.15);}
.ctrl-info{
  font-family:'DM Sans',sans-serif;font-size:12px;
  color:var(--muted);padding:0 12px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.dot-row{display:flex;gap:5px;align-items:center;padding:0 8px;}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(245,237,216,.2);cursor:pointer;
  transition:all .2s;
}
.dot.active{background:var(--gold);width:24px;border-radius:4px;}

/* ─────────── FACILITATOR NOTES OVERLAY ─────────── */
.notes-overlay{
  position:fixed;left:24px;bottom:24px;
  max-width:32vw;min-width:280px;
  background:rgba(10,20,36,.92);
  backdrop-filter:blur(12px);
  border:1px solid rgba(212,168,74,.3);
  border-radius:10px;padding:14px 16px;
  font-size:12.5px;line-height:1.6;color:var(--ink-soft);
  display:none;z-index:90;
}
.notes-overlay.show{display:block;}
.notes-lbl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px;}
.notes-txt{color:rgba(255,255,255,.85);}

/* ═══════════════════════════════════════════════════════
   SHARED SLIDE ELEMENTS
   ═══════════════════════════════════════════════════════ */

.eyebrow{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(13px,1.4vw,20px);letter-spacing:.4em;
  color:var(--gold);margin-bottom:3vh;font-weight:400;
}
.title-xl{
  font-family:'Playfair Display',serif;font-weight:900;
  font-size:clamp(48px,8vw,128px);line-height:.95;
  letter-spacing:-.015em;color:var(--cream);
}
.title-lg{
  font-family:'Playfair Display',serif;font-weight:700;
  font-size:clamp(36px,5.5vw,80px);line-height:1.05;
  letter-spacing:-.01em;color:var(--cream);
}
.title-md{
  font-family:'Playfair Display',serif;font-weight:600;
  font-size:clamp(28px,3.8vw,52px);line-height:1.15;
  color:var(--cream);
}
.kicker{
  font-family:'DM Sans',sans-serif;font-size:clamp(14px,1.5vw,20px);
  font-weight:500;color:var(--gold2);margin-top:2.5vh;letter-spacing:.04em;
}
.subtitle{
  font-family:'DM Sans',sans-serif;font-size:clamp(15px,1.6vw,22px);
  font-weight:400;color:var(--ink-soft);margin-top:2.5vh;line-height:1.5;
  max-width:48vw;
}

.verse-block{
  max-width:60vw;padding:4vh 5vw;
  border:1px solid var(--line);border-radius:14px;
  background:rgba(212,168,74,.04);
}
.verse-ref{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(13px,1.4vw,20px);letter-spacing:.3em;
  color:var(--gold);margin-bottom:2.5vh;
}
.verse-text{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(20px,2.6vw,38px);line-height:1.45;
  color:var(--cream);
}
.verse-en{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(14px,1.4vw,20px);line-height:1.5;
  color:var(--muted);margin-top:1.5vh;
}

.q-stack{display:flex;flex-direction:column;gap:2vh;max-width:62vw;text-align:left;}
.q-item{
  padding:1.3vh 2vw;border-left:3px solid var(--gold);
  background:rgba(212,168,74,.04);
  border-radius:0 8px 8px 0;
}
.q-lbl{font-family:'Bebas Neue',sans-serif;letter-spacing:.2em;color:var(--gold);font-size:clamp(11px,1.1vw,15px);margin-bottom:.5vh;}
.q-txt{font-family:'Playfair Display',serif;font-size:clamp(16px,1.9vw,26px);font-style:italic;color:var(--cream);line-height:1.4;}

.framework-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:2vw;
  max-width:78vw;margin-top:3vh;
}
.fw-cell{
  background:rgba(212,168,74,.05);
  border:1px solid var(--line);
  border-radius:14px;
  padding:3vh 1.5vw;text-align:center;
}
.fw-num{font-family:'Playfair Display',serif;font-size:clamp(32px,4vw,56px);font-weight:700;color:var(--gold);line-height:1;margin-bottom:1.5vh;}
.fw-ttl{font-family:'Playfair Display',serif;font-size:clamp(20px,2.2vw,32px);font-weight:600;color:var(--cream);margin-bottom:1.5vh;}
.fw-txt{font-family:'DM Sans',sans-serif;font-size:clamp(13px,1.3vw,17px);color:var(--ink-soft);line-height:1.55;}

.template-card{
  max-width:75vw;padding:4vh 4vw;
  border:1.5px solid var(--gold);border-radius:16px;
  background:rgba(212,168,74,.06);
}
.template-label{
  font-family:'Bebas Neue',sans-serif;letter-spacing:.3em;
  color:var(--gold);font-size:clamp(12px,1.3vw,17px);margin-bottom:2.5vh;
}
.template-text{
  font-family:'Playfair Display',serif;font-size:clamp(22px,2.6vw,38px);
  font-style:italic;line-height:1.5;color:var(--cream);
}
.template-blank{
  display:inline-block;background:rgba(212,168,74,.15);
  padding:0 .4em;border-bottom:2px solid var(--gold);
  color:var(--gold2);font-style:normal;font-family:'DM Sans',sans-serif;
  font-weight:500;font-size:.85em;letter-spacing:.04em;
  min-width:2em;text-align:center;
}

/* ─── S1: Hero ─── */
.hero-bg{
  background:
    radial-gradient(circle at 25% 30%, rgba(212,168,74,.18), transparent 55%),
    radial-gradient(circle at 75% 70%, rgba(42,62,107,.4), transparent 55%),
    linear-gradient(135deg, #0a1424 0%, #1b2a4a 100%);
}

/* ─── Whitney slide (special) ─── */
.whitney-bg{
  background:
    radial-gradient(circle at 50% 30%, rgba(212,168,74,.12), transparent 55%),
    linear-gradient(180deg, #1b2a4a 0%, #0a1424 100%);
}
.whitney-name{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:clamp(28px,3.6vw,52px);color:var(--gold2);margin-top:3vh;
}
.whitney-trio{
  display:flex;gap:2.5vw;margin-top:4vh;align-items:center;justify-content:center;
}
.wh-tag{
  padding:1.5vh 2.5vw;border:1px solid var(--line);border-radius:999px;
  font-family:'DM Sans',sans-serif;font-weight:500;
  font-size:clamp(14px,1.5vw,20px);color:var(--cream);
}
.wh-tag.yes{border-color:var(--gold);background:rgba(212,168,74,.1);color:var(--gold2);}
.wh-tag.no{border-color:rgba(255,255,255,.15);color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,100,100,.5);}

/* ─── Closing slide (different palette) ─── */
.closing-bg{
  background:
    radial-gradient(circle at 50% 50%, rgba(212,168,74,.22), transparent 55%),
    linear-gradient(135deg, #0a1424 0%, #2a3e6b 100%);
}

.big-stmt{
  font-family:'Playfair Display',serif;font-weight:700;
  font-size:clamp(40px,5.5vw,84px);line-height:1.1;
  color:var(--cream);max-width:80vw;
}
.big-stmt em{font-style:italic;color:var(--gold2);font-weight:600;}

.assignment-list{
  display:flex;flex-direction:column;gap:2.5vh;max-width:62vw;text-align:left;margin-top:3vh;
}
.al-item{
  display:flex;gap:2vw;align-items:flex-start;
}
.al-num{
  font-family:'Playfair Display',serif;font-size:clamp(28px,3vw,42px);font-weight:700;
  color:var(--gold);line-height:1;flex-shrink:0;min-width:1.5em;
}
.al-body{flex:1;}
.al-h{font-family:'Playfair Display',serif;font-size:clamp(20px,2vw,28px);font-weight:600;color:var(--cream);margin-bottom:.4vh;}
.al-d{font-family:'DM Sans',sans-serif;font-size:clamp(14px,1.4vw,19px);color:var(--ink-soft);line-height:1.5;}

.brand-footer{
  position:absolute;bottom:3vh;left:0;right:0;
  text-align:center;
  font-family:'Bebas Neue',sans-serif;letter-spacing:.4em;
  font-size:clamp(10px,1vw,13px);color:rgba(245,237,216,.25);
}

/* ── L12 additions: timer pill + question slides ── */
.timer-pill{
  position:absolute;top:2.2vh;right:1.6vw;
  background:#D4AF37;color:#141628;
  font-family:'DM Sans',sans-serif;font-weight:700;
  font-size:clamp(11px,1.15vw,16px);
  padding:.45em 1em;border-radius:999px;white-space:nowrap;z-index:5;
}
.q-tag{
  display:inline-block;background:var(--gold);color:#141628;
  font-family:'DM Sans',sans-serif;font-weight:700;
  font-size:clamp(11px,1.2vw,17px);letter-spacing:.06em;
  padding:.4em 1.1em;border-radius:999px;margin-bottom:3.2vh;
}
.q-main{
  font-family:'Playfair Display',serif;font-weight:700;
  font-size:clamp(26px,3.4vw,52px);line-height:1.25;
  color:var(--cream);max-width:78vw;
}
.q-sub2{
  margin-top:3.5vh;font-family:'DM Sans',sans-serif;font-style:italic;
  font-size:clamp(13px,1.5vw,21px);color:var(--gold2);max-width:70vw;
}
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<div class="controls">
  <button class="ctrl-btn" id="prev" title="Previous (←)">◂</button>
  <span class="ctrl-info"><span id="curr">1</span> / <span id="total">18</span></span>
  <button class="ctrl-btn" id="next" title="Next (→)">▸</button>
  <div class="dot-row" id="dots"></div>
  <button class="ctrl-btn" id="notesBtn" title="Toggle notes (N)">📝</button>
  <button class="ctrl-btn" id="fs" title="Fullscreen (F)">⛶</button>
</div>

<div class="notes-overlay" id="notesOverlay">
  <div class="notes-lbl">🎯 Facilitator Notes</div>
  <div class="notes-txt" id="notesTxt"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  SLIDES — Source of truth for content + speaker notes
//  Each slide: { html, notes }
//  PPTX deck mirrors this content + notes 1:1
// ═══════════════════════════════════════════════════════════

const SLIDES = [
  // ─── 1. HERO ───
  { html: `<div class="slide active hero-bg" id="s1">
  <div class="timer-pill">⏱ 80-min lesson</div>
  <div class="eyebrow">BTLI 1 · LESSON 12</div>
  <div class="title-xl">Natatanging<br>Disenyo</div>
  <div class="kicker">Understanding My Unique Design</div>
  <div class="subtitle">Paano ko matutuklasan ang natatanging disenyo ng Dios sa buhay ko?</div>
  <div style="margin-top:3vh"><span style="display:inline-block;background:var(--gold);color:#141628;font-family:'DM Sans',sans-serif;font-weight:700;font-size:clamp(11px,1.2vw,17px);padding:.4em 1.1em;border-radius:999px;margin:0 .4em">🌿 Self-Control</span><span style="display:inline-block;background:var(--gold);color:#141628;font-family:'DM Sans',sans-serif;font-weight:700;font-size:clamp(11px,1.2vw,17px);padding:.4em 1.1em;border-radius:999px;margin:0 .4em">⚡ S.H.A.P.E. Discovery</span></div>
  <div class="brand-footer">MULTIPLY LEADERSHIP PIPELINE · LESSON 12</div>
</div>`, notes: `OPENING — project while participants settle. Don't speak over it. Lesson 12 of BTLI 1, second lesson of the UNLAD spine, paired with Mac Lake's Leading Yourself Module 2 (Emotional Intelligence · Self-Control). Character anchor: Self-Control — the discipline that refuses the comparison loop. Competence: S.H.A.P.E. Discovery feeding the MULTIPLY assessment battery. When ready: "Magandang gabi, kapatid. Magsisimula tayo." Move to slide 2.` },
  // ─── 2. ⚡ PUKAW · L11 CALLBACK ───
  { html: `<div class="slide hero-bg" id="s2">
  <div class="timer-pill">⏱ 2 min · ⌛3:00</div>
  <div class="eyebrow">⚡ PUKAW · L11 CALLBACK</div>
  <div class="title-lg">Kumusta ang 10-day<br>mission journal natin?</div>
  <div class="subtitle">Sino ang naka-check kahit isang araw sa tracker? Itaas ang kamay.</div>
  <div class="verse-ref" style="margin-top:3vh">1 volunteer · 30-second story</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 2 / 36</div>
</div>`, notes: `PUKAW ~2 min (target 3:00). Honor what they carried home from Lesson 11. ASK: "Sino ang naka-check kahit isang araw sa 10-day tracker? Itaas ang kamay." Celebrate every hand. ONE volunteer, 30 seconds: "Anong isang bagay ang ginawa mo alinsunod sa misyon mo?" PASTORAL: someone with zero checks is watching your face. Say plainly: "Kung wala kang na-check — welcome pa rin. Ang tracker ay tulong, hindi timbangan." Celebrate, don't shame.` },
  // ─── 3. ⚡ PUKAW · MEMORY VERSE ───
  { html: `<div class="slide hero-bg" id="s3">
  <div class="timer-pill">⏱ 1 min · ⌛4:00</div>
  <div class="eyebrow">⚡ PUKAW · MEMORY VERSE</div>
  <div class="title-lg" style="margin-bottom:3vh">MEMORY VERSE</div>
  <div class="verse-block"><div class="verse-text">"Sapagkat tayo'y kanyang pinakamahusay na gawa, na nilalang kay Cristo Jesus para sa mabubuting gawa, na inihanda ng Diyos nang una upang siya nating lakaran."</div><div class="verse-ref">EPHESIANS 2:10</div></div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 3 / 36</div>
</div>`, notes: `PUKAW ~1 min (target 4:00). Read together, twice — once from the slide, once with eyes closed repeating after you. Land on one phrase: "pinakamahusay na gawa" — masterpiece. Tease: "Babalikan natin ang salitang ito mamaya. Greek pa nga ang pinanggalingan e." Plant the seed; don't teach it yet.` },
  // ─── 4. ⚡ PUKAW · TANAW ───
  { html: `<div class="slide hero-bg" id="s4">
  <div class="timer-pill">⏱ 4 min · ⌛8:00</div>
  <div class="eyebrow">⚡ PUKAW · TANAW</div>
  <div class="title-lg">Ang Uwak na Naghanap ng<br>Pinakamasayang Ibon</div>
  <div class="subtitle">Uwak ➜ Swan ➜ Parrot ➜ Peacock ➜ … "Sana isa na lang akong uwak!"</div>
  <div class="verse-ref" style="margin-top:3vh">4 VOLUNTEER READERS · READER'S THEATER</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 4 / 36</div>
</div>`, notes: `PUKAW ~4 min (target 8:00). Tell the UNLAD fable theatrically with your 4 pre-asked readers. The crow flies free — until it envies the swan's white feathers. The swan envies the parrot's two-tone. The parrot envies the peacock's colors. The peacock — surrounded by fans, walang privacy — sighs: "Sana isa na lang akong uwak!" FULL STOP after that line. Let the room feel the loop close: nobody in the comparison loop is happy, because the loop has no exit. Don't explain the moral — the next slide's question does that work.` },
  // ─── 5. ⚡ PUKAW · TANONG ───
  { html: `<div class="slide hero-bg" id="s5">
  <div class="timer-pill">⏱ 4 min · ⌛12:00</div>
  <div class="eyebrow">⚡ PUKAW · TANONG</div>
  <div><span class="q-tag">📋 Participant Guide Question</span></div>
  <div class="q-main">Ano ang moral of the story? Ano ang magiging epekto 'pag lagi mong ikinukumpara ang iyong sarili sa ibang tao?</div>
  <div class="q-sub2">Pag-usapan sa mesa — pagkatapos, isulat sa Participant Guide.</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 5 / 36</div>
</div>`, notes: `PUKAW ~4 min (target 12:00). PARTICIPANT GUIDE QUESTION — two parts, answered in the guide after table talk. Tables discuss 2 minutes, then everyone writes. Listen for the word "inggit" and for social-media comparisons — they will surface. Interns roam: the personal example unlocks quiet tables ("Ako, noong college, lagi kong ikinukumpara ang sarili ko kay ___"). Then bridge: "Mahirap mabuhay sa anino ng ibang tao... Nilikha ka ng Dios na natatangi at kakaiba. Tingnan natin ang Salita."` },
  // ─── 6. 📖 TUKLAS · BIG IDEA ───
  { html: `<div class="slide hero-bg" id="s6">
  <div class="timer-pill">⏱ 2 min · ⌛14:00</div>
  <div class="eyebrow">📖 TUKLAS · BIG IDEA</div>
  <div class="title-lg" style="margin-bottom:3vh">BIG IDEA</div>
  <div class="verse-block"><div class="verse-text">Nag-iisa lang ang kagaya mo sa mundo — iwasan ang kakakumpara. Mabuhay at maglingkod nang husto ayon sa disenyo ng Lumikha.</div><div class="verse-ref">UNLAD · LESSON 2</div></div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 6 / 36</div>
</div>`, notes: `TUKLAS ~2 min (target 14:00). Read it slowly, TWICE. This single sentence is the spine of the night — everything after it is evidence and application. "'Wag kang mabuhay para sa palakpak nila, kundi para sa ngiti ng iyong Lumikha."` },
  // ─── 7. 📖 TUKLAS · ANG BABALA ───
  { html: `<div class="slide hero-bg" id="s7">
  <div class="timer-pill">⏱ 3 min · ⌛17:00</div>
  <div class="eyebrow">📖 TUKLAS · ANG BABALA</div>
  <div class="title-lg">"Mga 'di sila nag-iisip!"</div>
  <div class="subtitle">"Hindi namin iko-compare ang sarili namin sa mga taong mataas ang tingin sa sarili nila. Ginagawa nilang standard ang mga sarili nila, tapos sila-sila lang din ang nagko-compare sa isat-isa!"</div>
  <div class="verse-ref" style="margin-top:3vh">2 CORINTHIANS 10:12 · NEW TESTAMENT: PINOY VERSION</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 7 / 36</div>
</div>`, notes: `TUKLAS ~3 min (target 17:00). Have someone read the Pinoy Version aloud — it bites. Point at the last phrase: Apostle Paul calls the comparison game FOOLISHNESS — kamangmangan, not a weakness or a quirk. Connect to the birds: "Ang uwak, swan, parrot at peacock — lahat sila ginawang standard ang isa't isa. Lahat sila malungkot. Mga 'di sila nag-iisip." Land the image from the book: fixated on what's "uso," we drift into deep water — palutang-lutang, waiting for the next wave.` },
  // ─── 8. 📖 TUKLAS · POIEMA ───
  { html: `<div class="slide hero-bg" id="s8">
  <div class="timer-pill">⏱ 3 min · ⌛20:00</div>
  <div class="eyebrow">📖 TUKLAS · POIEMA</div>
  <div class="title-lg" style="margin-bottom:3vh">MASTERPIECE.</div>
  <div class="verse-block"><div class="verse-text">"For we are God's masterpiece. He has created us anew in Christ Jesus, so we can do the good things he planned for us long ago."</div><div class="verse-ref">EPHESIANS 2:10 (NLT) · Greek: POIEMA — "work of art"</div></div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 8 / 36</div>
</div>`, notes: `TUKLAS ~3 min (target 20:00). The exit from the prison. Teach the one Greek word of the night: POIEMA — literally "work of art," the root of our word "poem." Some translations: workmanship. "Kapag sinabi ng Diyos na ikaw ay poiema, sinasabi Niya: 'Hindi ka aksidente. Tinula kita.'" A painting doesn't compare itself to another painting — it fulfills the painter's intent. PASTORAL: for those told all their lives na "walang silbi" sila — this verse is surgery, not information. If you see wet eyes, slow down. The next slide gives a private place to respond.` },
  // ─── 9. 📖 TUKLAS · TANONG ───
  { html: `<div class="slide hero-bg" id="s9">

  // ─── 10. 📖 TUKLAS · NATATANGING AMBAG ───
  { html: `<div class="slide hero-bg" id="s10">

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 10 / 36</div>
</div>`, notes: `TUKLAS ~3 min (target 26:00). "Hindi ka ginawang masterpiece ni God para maging display lang!" The good works were PREPARED IN ADVANCE (Eph 2:10b). Two witnesses: Jeremiah — chosen before conception to be a prophet; Paul — set apart before birth, called to preach to the Gentiles. God's pattern: design precedes birth; mission is stitched into design. "Hindi ka lang basta nabubuhay para magtrabaho, kumita, magkaroon ng career at pamilya — gagamitin ka ni Lord para sa makabuluhang impact."` },
  // ─── 11. 📖 TUKLAS · TANONG ───
  { html: `<div class="slide hero-bg" id="s11">

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 11 / 36</div>
</div>`, notes: `TUKLAS ~3 min (target 29:00). PARTICIPANT GUIDE QUESTION. Lesson 11 alumni pull up their mission statement draft — continuity, not a new question. First-timers write their best current guess. Normalize the blank: "Kung clueless ka pa — hindi ka nag-iisa, at may mapa tayo ngayong gabi." That's the bridge to S.H.A.P.E.` },
  // ─── 12. 📖 TUKLAS · ANG MAPA ───
  { html: `<div class="slide hero-bg" id="s12">

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 12 / 36</div>
</div>`, notes: `TUKLAS ~3 min (target 32:00). Bridge: "Kung clueless ka pa sa specific na misyon mo — may mapa: limang bintana para makita ang disenyo ng Dios sa'yo." The acronym popularized by Rick Warren. Quote Erik Rees: "Kapag naka-align ang mga pangarap mo sa mga pagnanais ng Dios, nagkakaroon ka ng kumpiyansa na tanggapin ang iyong natatanging kingdom assignment." Tell them the plan: "Bago natin buksan ang limang bintana — may bantay muna tayong kailangan: self-control. Ang disenyo ay nakikita lang ng pusong hindi hinihila ng inggit."` },
  // ─── 13. 💡 TALAKAY · CHARACTER ANCHOR ───
  { html: `<div class="slide hero-bg" id="s13">

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 13 / 36</div>
</div>`, notes: `TALAKAY ~2 min (target 34:00). Character anchor from Mac Lake's Leading Yourself Module 2: SELF-CONTROL — managing and restraining your impulses, emotions, and desires, exercising discipline to make thoughtful decisions. Proverbs 25:28: a person without self-control is a city with broken walls — anything gets in: inggit, insecurity, pride, padalos-dalos na salita. Connect to tonight: THE COMPARISON LOOP IS AN EMOTIONS PROBLEM. The crow didn't have an information problem — it had an unguarded heart. Self-control is the wall that keeps comparison out and design in.` },
  // ─── 14. 💡 TALAKAY · TANONG ───
  { html: `<div class="slide hero-bg" id="s14">
  <div class="timer-pill">⏱ 2 min · ⌛36:00</div>
  <div class="eyebrow">💡 TALAKAY · TANONG</div>
  <div><span class="q-tag">📋 Participant Guide Question</span></div>

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 14 / 36</div>
</div>`, notes: `TALAKAY ~2 min (target 36:00). PARTICIPANT GUIDE QUESTION — from Leading Yourself Module 2's Scripture reflection. External AND internal reactions: ang mukha at ang kalooban. Push for a real situation — "ngayong buwan, hindi 'minsan.'" This is emotional self-awareness in writing: the first EI skill. Interns: no sharing required on this one; it feeds the emotions journal assignment in DALHIN.` },
  // ─── 15. 💡 TALAKAY · EI TRIANGLE ───
  { html: `<div class="slide hero-bg" id="s15">
  <div class="timer-pill">⏱ 2 min · ⌛38:00</div>
  <div class="eyebrow">💡 TALAKAY · EI TRIANGLE</div>
  <div class="title-lg">The Emotional Intelligence<br>Triangle</div>
  <div class="subtitle">GOD — YOU — OTHERS. Bawat emosyon, dinadala sa tatlong sulok: aware ka ba (YOU)? Tapat at may empathy ka ba (OTHERS)? Naaayon ba sa katotohanan ng Dios ang tugon mo (GOD)?</div>
  <div class="verse-ref" style="margin-top:3vh">AWARENESS · HONESTY · EMPATHY · WISDOM — MAC LAKE, LEADING YOURSELF</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 15 / 36</div>
</div>`, notes: `TALAKAY ~2 min (target 38:00). Mac Lake's Emotional Intelligence Triangle: God at the apex, You and Others at the base. EI defined: understanding your own or others' emotions and allowing the Holy Spirit to guide you toward a wise response. Four movements around the triangle: AWARENESS (name what you feel), HONESTY (name the true cause, not the justified version), EMPATHY (understand the other's perspective), WISDOM (respond grounded in God's truth). Why here: the five S.H.A.P.E. windows require exactly this honesty — you cannot see your design through unexamined emotions. The downloadable Triangle tool is pointed to in DALHIN (multiplygroup.org/leadingyourself).` },
  // ─── 16. 💡 TALAKAY · UNANG BINTANA ───
  { html: `<div class="slide hero-bg" id="s16">
  <div class="timer-pill">⏱ 2 min · ⌛40:00</div>
  <div class="eyebrow">💡 TALAKAY · UNANG BINTANA</div>
  <div class="title-lg">S · Spiritual Gifts</div>
  <div class="subtitle">Hindi ito tungkol sa IYO at para sa IYO (1 Cor 12:7) · Bawat mananampalataya ay may tinanggap (1 Cor 7:7) · Hindi tayo pare-pareho (1 Cor 7:7)</div>
  <div class="verse-ref" style="margin-top:3vh">"Nakadepende ang talent sa sariling galing, nakadepende ang spiritual gifts sa kakayanan ng Dios." — LESLIE FLYNN</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 16 / 36</div>
</div>`, notes: `TALAKAY ~2 min (target 40:00). Not the same as natural talent — quote Leslie Flynn: talents concern techniques and methods; spiritual gifts concern spiritual abilities; talent depends on your own skill, gifts depend on God's power. Three truths, fast: (1) not about you or for you — "para sa ikabubuti ng lahat"; (2) every believer has at least one; (3) we are not gifted alike. MULTIPLY note: "May Spiritual Gifts Assessment tayo sa Member Tool — babalikan natin mamaya sa GAWIN."` },
  // ─── 17. 💡 TALAKAY · IKALAWANG BINTANA ───
  { html: `<div class="slide hero-bg" id="s17">

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 17 / 36</div>
</div>`, notes: `TALAKAY ~2 min (target 42:00). Rick Warren: just as each of us has unique thumbprints, eye prints and voice prints, we each have a unique EMOTIONAL HEARTBEAT — magandang clues kung saang area ka dapat maglingkod. Notice the EI connection: an emotionally aware disciple can actually read their own heartbeat. Preview the three Passion Questions coming in GAWIN: ano ang nagpapa-alab; kanino ka sobrang concerned; anong God-centered dreams. The old Nescafe hook for #2: "Para kanino ka bumabangon?"` },
  // ─── 18. 💡 TALAKAY · IKATLONG BINTANA ───
  { html: `<div class="slide hero-bg" id="s18">

  <div class="verse-ref" style="margin-top:3vh">WALANG TAPON AT WALANG SAYANG SA MGA ABILIDAD NA IBINIGAY NI LORD</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 18 / 36</div>
</div>`, notes: `TALAKAY ~1 min (target 43:00). Tom Paterson's warning: undiscovered, undeveloped abilities leave a person poor in purpose, meaning, and worth. Walang tapon at walang sayang. Quick caveat from the book: God WILL sometimes take them outside-of-comfort-zone — the bottom line is dependence on the Lord, not self-optimization. Keep this window to one minute — the four inventory prompts land in GAWIN.` },
  // ─── 19. 💡 TALAKAY · IKAAPAT NA BINTANA ───
  { html: `<div class="slide hero-bg" id="s19">

  <div class="eyebrow">💡 TALAKAY · IKAAPAT NA BINTANA</div>
  <div class="title-lg">P · Personality</div>
  <div class="subtitle">Ang katangi-tanging paraan ng pag-iisip, pakiki-relate at pag-uugali — bigay ng Dios para mas ma-express ang iyong gifts, abilities at heart.</div>
  <div class="verse-ref" style="margin-top:3vh">"WALANG MAS SUPERIOR SA MGA CATEGORIES NA YAN" — MAS MACO-COMPLEMENT NATIN ANG ISA'T ISA</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 19 / 36</div>
</div>`, notes: `TALAKAY ~1 min (target 44:00). APA definition, simplified: your distinct way of thinking, relating, behaving. The punchline the room needs: "Walang mas superior sa mga categories na yan." Introvert is not a broken extrovert; reserved is not a failed expressive. God gave your innate personality so your gifts get expressed EFFECTIVELY — and our differences exist so we can complement one another. One minute — the six pairs get tapped in GAWIN.` },
  // ─── 20. 💡 TALAKAY · IKALIMANG BINTANA ───
  { html: `<div class="slide hero-bg" id="s20">

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 20 / 36</div>
</div>`, notes: `TALAKAY ~2 min (target 46:00). The window people flinch at — successes AND wounds. God uses achievements to inspire; and the painful roads — abuse, poverty, addiction, serious illness — surrendered whole to Him become a KAKAIBANG ATTRACTION: credibility no seminary can grant, for reaching people on the same road. PASTORAL — say it out loud NOW, before GAWIN: "Ang isusulat ninyo sa Experiences window ay sa inyo at sa Dios. Walang pipilitin mag-share." If someone discloses trauma to you afterward: listen fully, thank them for trusting you, walk with them to the Pastor privately.` },
  // ─── 21. 💡 TALAKAY · INTERACT ───
  { html: `<div class="slide hero-bg" id="s21">
  <div class="timer-pill">⏱ 3 min · ⌛49:00</div>
  <div class="eyebrow">💡 TALAKAY · INTERACT</div>
  <div><span class="q-tag">📋 Participant Guide Question</span></div>
  <div class="q-main">Justifiable ba ang inferiority complex ng ibang Christians dahil wala sila ng mga bagay na taglay ng iba?</div>
  <div class="q-sub2">Debate sa mesa — AGREE o DISAGREE + isang dahilan. Pagkatapos, isulat ang paninindigan mo sa Participant Guide.</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 21 / 36</div>
</div>`, notes: `TALAKAY ~3 min (target 49:00). PARTICIPANT GUIDE QUESTION — Interact debate 1. Let tables argue BOTH sides ~90 seconds, sticky note verdicts on the wall, read 2 aloud. Then land it: sympathy for the wound — but the verdict is Ephesians 2:10. Calling God's masterpiece worthless is not humility; it is disagreement with the Artist. Debate ideas, never persons — there are comparison-wounded people at every table.` },
  // ─── 22. 💡 TALAKAY · INTERACT ───
  { html: `<div class="slide hero-bg" id="s22">

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 22 / 36</div>
</div>`, notes: `TALAKAY ~3 min (target 52:00). PARTICIPANT GUIDE QUESTION — Interact debate 2, the mirror image. Draw out the insight: INFERIORITY AND SUPERIORITY ARE THE SAME DISEASE — eyes locked on self instead of the Designer, an unguarded city on both counts (Prov 25:28). Manliliit ka o mangmamaliit ka — parehong nasa comparison loop, parehong kulang sa self-control. The cure for both: 1 Cor 12:7 — the gifts are "para sa ikabubuti ng lahat," never trophies. 60-second landing, then transition to GAWIN: "Tama na ang usapan TUNGKOL sa disenyo — tuklasin na natin ang SA INYO."` },
  // ─── 23. 🙌 GAWIN · S.H.A.P.E. INVENTORY ───
  { html: `<div class="slide hero-bg" id="s23">

</div>`, notes: `GAWIN ~1 min (target 53:00). Everyone opens the Participant Guide (QR on screen). Explain the workflow: you advance one question per slide; they write. Quiet worship music under the whole block. Interns are a quiet presence — help the stuck with PROMPTS, never answers. "Walang tama o mali. First draft ito ng larawan ng disenyo ng Dios sa'yo. Gamitin ang honesty na pinag-usapan natin sa EI Triangle."` },
  // ─── 24. 🙌 GAWIN · S ───
  { html: `<div class="slide hero-bg" id="s24">

</div>`, notes: `GAWIN ~2 min (target 55:00). PARTICIPANT GUIDE QUESTION — the book points back to the Spiritual Gifts Survey from Book 2 (USAD); ours lives in the MULTIPLY Member Tool. Never taken it? Best guess + star — the assessment battery in DALHIN closes the gap before Lesson 13. Interns: note who has starred blanks — they are the assessment follow-up list.` },
  // ─── 25. 🙌 GAWIN · H · PASSION 1 ───
  { html: `<div class="slide hero-bg" id="s25">

  <div class="q-sub2">Isulat sa Participant Guide.</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 25 / 36</div>
</div>`, notes: `GAWIN ~2 min (target 57:00). PARTICIPANT GUIDE QUESTION — Passion Question 1. Frame from the book: passions placed by the Lord cannot be ignored, like a burn. Some are ablaze for unreached tribes, others for teaching, music, multimedia, sports, community service. The test is the phrase "walang bayad at panghabang-buhay" — not 'gusto ko' but 'hindi ko mailagan.'` },
  // ─── 26. 🙌 GAWIN · H · PASSION 2 ───
  { html: `<div class="slide hero-bg" id="s26">
  <div class="timer-pill">⏱ 2 min · ⌛59:00</div>
  <div class="eyebrow">🙌 GAWIN · H · PASSION 2</div>
  <div><span class="q-tag">📋 Participant Guide Question</span></div>

  <div class="q-sub2">Kids, teens, young pro, adults? Anong social class? Sino ang nasa sphere of influence mo? — Isulat sa Participant Guide.</div>
  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 26 / 36</div>
</div>`, notes: `GAWIN ~2 min (target 59:00). PARTICIPANT GUIDE QUESTION — Passion Question 2. "Para kanino ka bumabangon?" Beyond the obvious answer (para kay Lord): which people group is genuinely closest to their heart — physically/mentally challenged or gifted? Yayamanin, middle class, o masa? Kids, teens, young professionals, adults? Who is already in their sphere of influence? Specificity here becomes ministry placement data.` },
  // ─── 27. 🙌 GAWIN · H · PASSION 3 ───
  { html: `<div class="slide hero-bg" id="s27">
  <div class="timer-pill">⏱ 2 min · ⌛61:00</div>

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 27 / 36</div>
</div>`, notes: `GAWIN ~2 min (target 61:00). PARTICIPANT GUIDE QUESTION — Passion Question 3. What do they long to see accomplished in their lifetime? What is their dream for the Church? What do they already have that they are ready to offer for the expansion of the kingdom — like the boy's five loaves and two fish (John 6:9)? Small offerings, surrendered, feed thousands.` },
  // ─── 28. 🙌 GAWIN · A · ABILITIES ───
  { html: `<div class="slide hero-bg" id="s28">
  <div class="timer-pill">⏱ 2 min · ⌛63:00</div>

  <div class="brand-footer">MULTIPLY · DISCIPLE-MAKING PIPELINE · 28 / 36</div>
</div>`, notes: `GAWIN ~2 min (target 63:00). PARTICIPANT GUIDE QUESTION — the four-part Abilities inventory, answered as one block: strengths · deep enjoyment · repeated commendation · natural-to-you-hard-for-others. Kapag malinaw ang sagot sa apat, lulutang ang abilities. Intern prompt for the stuck: "Anong bagay ang nire-request sa'yo ng mga tao paulit-ulit? Iyon ang bakas ng ability." Or ask the seatmate — minsan mas nakikita ng mesa kaysa sa kanya.` },
  // ─── 29. 🙌 GAWIN · P · PERSONALITY ───

// ═══════════════════════════════════════════════════════════
//  NOTES[] export — for facilitator hint extraction + PPTX
// ═══════════════════════════════════════════════════════════
const NOTES = SLIDES.map((s, i) => ({ slide: i+1, notes: s.notes }));
window.NOTES = NOTES;

// ═══════════════════════════════════════════════════════════
//  RENDERER
// ═══════════════════════════════════════════════════════════
const stage = document.getElementById('stage');
const dots  = document.getElementById('dots');
const currEl= document.getElementById('curr');
const totalEl=document.getElementById('total');
const notesOverlay = document.getElementById('notesOverlay');
const notesTxt = document.getElementById('notesTxt');

// Inject slides
stage.innerHTML = SLIDES.map(s => s.html).join('\n');
totalEl.textContent = SLIDES.length;

// Build dot row
SLIDES.forEach((_, i) => {
  const d = document.createElement('span');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => goTo(i));
  dots.appendChild(d);
});

let idx = 0;
const slides = document.querySelectorAll('.slide');
const dotEls = document.querySelectorAll('.dot');

function goTo(i){
  if (i < 0 || i >= SLIDES.length) return;
  slides[idx].classList.remove('active');
  dotEls[idx].classList.remove('active');
  idx = i;
  slides[idx].classList.add('active');
  dotEls[idx].classList.add('active');
  currEl.textContent = idx + 1;
  notesTxt.textContent = SLIDES[idx].notes;
}

document.getElementById('prev').onclick = () => goTo(idx - 1);
document.getElementById('next').onclick = () => goTo(idx + 1);

document.getElementById('notesBtn').onclick = () => {
  notesOverlay.classList.toggle('show');
};

document.getElementById('fs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

// Keyboard nav
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); goTo(idx + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); goTo(idx - 1); }
  else if (e.key === 'Home') goTo(0);
  else if (e.key === 'End') goTo(SLIDES.length - 1);
  else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
  else if (e.key === 'n' || e.key === 'N') notesOverlay.classList.toggle('show');
});

// Initialize notes
notesTxt.textContent = SLIDES[0].notes;
</script>
