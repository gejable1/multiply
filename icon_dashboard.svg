<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Warm gold background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#d4a437"/>

  <!-- Soft inner glow (warmer toward center) -->
  <radialGradient id="bglow" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="#f0c854" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#d4a437" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="96" fill="url(#bglow)"/>

  <!-- TREE FROM ABOVE: 6-petal canopy with center trunk + growth rings -->
  <g transform="translate(256 256)">
    <!-- Outer canopy — 6 leaves rotated around center, alternating shades -->
    <ellipse cx="0" cy="-130" rx="60" ry="100" fill="#1f5d44"/>
    <g transform="rotate(60)"><ellipse cx="0" cy="-130" rx="60" ry="100" fill="#2a7556"/></g>
    <g transform="rotate(120)"><ellipse cx="0" cy="-130" rx="60" ry="100" fill="#1f5d44"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-130" rx="60" ry="100" fill="#2a7556"/></g>
    <g transform="rotate(240)"><ellipse cx="0" cy="-130" rx="60" ry="100" fill="#1f5d44"/></g>
    <g transform="rotate(300)"><ellipse cx="0" cy="-130" rx="60" ry="100" fill="#2a7556"/></g>

    <!-- Inner canopy lighter ring (creates depth) -->
    <ellipse cx="0" cy="-90" rx="40" ry="60" fill="#3d8a5c" opacity="0.85"/>
    <g transform="rotate(60)"><ellipse cx="0" cy="-90" rx="40" ry="60" fill="#5fc88f" opacity="0.85"/></g>
    <g transform="rotate(120)"><ellipse cx="0" cy="-90" rx="40" ry="60" fill="#3d8a5c" opacity="0.85"/></g>
    <g transform="rotate(180)"><ellipse cx="0" cy="-90" rx="40" ry="60" fill="#5fc88f" opacity="0.85"/></g>
    <g transform="rotate(240)"><ellipse cx="0" cy="-90" rx="40" ry="60" fill="#3d8a5c" opacity="0.85"/></g>
    <g transform="rotate(300)"><ellipse cx="0" cy="-90" rx="40" ry="60" fill="#5fc88f" opacity="0.85"/></g>

    <!-- Center trunk viewed from above — concentric rings hint at lineage/depth -->
    <circle cx="0" cy="0" r="28" fill="#0e3a2c"/>
    <circle cx="0" cy="0" r="20" fill="#5a3a1c"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#3d2510" stroke-width="2"/>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#3d2510" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#0e3a2c"/>
  </g>
</svg>
